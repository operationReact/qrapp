  <rect x="105" y="95" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <rect x="130" y="95" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <rect x="155" y="95" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <rect x="80" y="125" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <rect x="105" y="125" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <rect x="130" y="125" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <rect x="155" y="125" width="18" height="22" fill="#38bdf8" opacity="0.85"/>
  <!-- Door -->
