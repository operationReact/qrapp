<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-cc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <g opacity="0.08">
    <circle cx="128" cy="140" r="115" fill="url(#grad-cc)"/>
  </g>
  <!-- Main Building -->
  <rect x="70" y="80" width="116" height="95" rx="6" fill="#0891b2" opacity="0.92" filter="url(#shadow)"/>
  <!-- Windows Grid -->
