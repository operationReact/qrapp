<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <g opacity="0.08">
    <circle cx="128" cy="140" r="110" fill="url(#grad-acc)"/>
  </g>
  <!-- Shield -->
  <path d="M 85 75 L 85 135 Q 85 150 100 150 L 156 150 Q 171 150 171 135 L 171 75 Q 171 65 161 65 L 95 65 Q 85 65 85 75" fill="#4f46e5" opacity="0.9" filter="url(#shadow)" stroke="#3b82f6" stroke-width="2"/>
  <!-- Shield inner -->
  <path d="M 90 80 L 90 130 Q 90 142 100 142 L 156 142 Q 166 142 166 130 L 166 80" fill="#06b6d4" opacity="0.5"/>
  <!-- Lock circle -->
  <circle cx="128" cy="105" r="14" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.8"/>
  <!-- Lock shackle -->
  <path d="M 128 112 L 128 125" stroke="#06b6d4" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
  <!-- Key (yellow) -->
  <circle cx="100" cy="95" r="15" fill="#fbbf24" opacity="0.85" filter="url(#shadow)"/>
  <!-- Key shaft -->
  <rect x="112" y="90" width="35" height="10" fill="#fbbf24" opacity="0.85" rx="5"/>
  <!-- Key teeth -->
  <rect x="140" y="95" width="8" height="8" fill="#ca8a04" opacity="0.8"/>
  <rect x="150" y="95" width="8" height="8" fill="#ca8a04" opacity="0.8"/>
</svg>