<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-party" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <g opacity="0.08">
    <circle cx="128" cy="140" r="110" fill="url(#grad-party)"/>
  </g>
  <!-- Calendar -->
  <rect x="75" y="90" width="106" height="75" rx="4" fill="#f59e0b" opacity="0.85" filter="url(#shadow)"/>
  <!-- Calendar header line -->
  <line x1="80" y1="115" x2="180" y2="115" stroke="#d97706" stroke-width="2" opacity="0.7"/>
  <!-- Balloons (string top) -->
  <circle cx="90" cy="75" r="5" fill="#f97316" opacity="0.8"/>
  <circle cx="110" cy="68" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="130" cy="70" r="5" fill="#f97316" opacity="0.8"/>
  <circle cx="150" cy="65" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="170" cy="75" r="5" fill="#f97316" opacity="0.8"/>
  <!-- Balloon strings -->
  <line x1="90" y1="80" x2="85" y2="115" stroke="#f97316" stroke-width="1" opacity="0.6"/>
  <line x1="110" y1="73" x2="108" y2="115" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="75" x2="128" y2="115" stroke="#f97316" stroke-width="1" opacity="0.6"/>
  <line x1="150" y1="70" x2="148" y2="115" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <line x1="170" y1="80" x2="171" y2="115" stroke="#f97316" stroke-width="1" opacity="0.6"/>
  <!-- Cake -->
  <ellipse cx="128" cy="140" rx="35" ry="12" fill="#ec4899" opacity="0.75"/>
  <rect x="105" y="130" width="46" height="12" fill="#ec4899" opacity="0.8"/>
  <!-- Candle -->
  <rect x="123" y="120" width="10" height="12" fill="#ca8a04" opacity="0.85"/>
  <!-- Flame -->
  <path d="M 128 115 Q 125 110 128 105 Q 131 110 128 115" fill="#fbbf24" opacity="0.9"/>
  <!-- Confetti -->
  <circle cx="95" cy="125" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="155" cy="120" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="100" cy="155" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="160" cy="155" r="1.5" fill="#fbbf24" opacity="0.6"/>
</svg>