<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-vnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <g opacity="0.08">
    <circle cx="128" cy="140" r="110" fill="url(#grad-vnd)"/>
  </g>
  <!-- Building -->
  <rect x="75" y="100" width="106" height="65" rx="4" fill="#ea580c" opacity="0.9" filter="url(#shadow)"/>
  <!-- Roof -->
  <polygon points="75,100 128,70 181,100" fill="#f97316" opacity="0.85"/>
  <!-- Awning stripes -->
  <polygon points="85,100 95,85 171,85 181,100" fill="#fbbf24" opacity="0.75"/>
  <!-- Awning shadow -->
  <polygon points="87,100 97,87 173,87 183,100" fill="#ca8a04" opacity="0.5" opacity="0.5"/>
  <!-- Windows -->
  <rect x="88" y="110" width="16" height="20" fill="#fbbf24" opacity="0.8"/>
  <rect x="115" y="110" width="16" height="20" fill="#fbbf24" opacity="0.8"/>
  <rect x="152" y="110" width="16" height="20" fill="#fbbf24" opacity="0.8"/>
  <!-- Door -->
  <rect x="118" y="130" width="20" height="35" fill="#78350f" opacity="0.7"/>
  <circle cx="135" cy="147" r="2" fill="#ca8a04" opacity="0.8"/>
  <!-- Products/Boxes -->
  <rect x="65" y="165" width="18" height="18" fill="#ea580c" opacity="0.8"/>
  <rect x="115" y="168" width="18" height="18" fill="#f97316" opacity="0.75"/>
  <rect x="175" y="165" width="18" height="18" fill="#fb923c" opacity="0.7"/>
</svg>