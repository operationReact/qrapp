<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-pay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="none"/>
  <g opacity="0.08">
    <circle cx="128" cy="140" r="110" fill="url(#grad-pay)"/>
  </g>
  <!-- Terminal body -->
  <rect x="70" y="100" width="116" height="60" rx="6" fill="#1f2937" opacity="0.9" filter="url(#shadow)"/>
  <!-- Screen -->
  <rect x="75" y="105" width="106" height="30" rx="3" fill="#10b981" opacity="0.8"/>
  <!-- Screen text indicator -->
  <circle cx="85" cy="130" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="100" cy="130" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="115" cy="130" r="3" fill="#fbbf24" opacity="0.9"/>
  <!-- Card slot indicator (top right) -->
  <rect x="145" y="125" width="18" height="8" fill="#0891b2" opacity="0.8" stroke="#06b6d4" stroke-width="1" rx="2"/>
  <!-- Keypad area -->
  <rect x="75" y="140" width="106" height="15" fill="#111827" opacity="0.7"/>
  <!-- Button indicators -->
  <circle cx="85" cy="147" r="2.5" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="100" cy="147" r="2.5" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="115" cy="147" r="2.5" fill="#6ee7b7" opacity="0.7"/>
  <!-- Coins -->
  <circle cx="75" cy="165" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="185" cy="165" r="6" fill="#fbbf24" opacity="0.8"/>
  <!-- Checkmark -->
  <text x="128" y="162" font-size="12" text-anchor="middle" fill="#10b981" font-weight="bold" opacity="0.7">✓</text>
</svg>