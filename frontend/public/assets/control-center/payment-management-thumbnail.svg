<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pay-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pay-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="pay-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="pay-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pay-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="pay-coin" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="ds" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.24"/>
    </filter>
    <filter id="blurSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="206" rx="80" ry="11" fill="#022c22" opacity="0.16" filter="url(#blurSoft)"/>
  <g filter="url(#ds)">
    <rect x="70" y="96" width="76" height="104" rx="8" fill="url(#pay-front)"/>
    <polygon points="146,96 178,108 178,196 146,200" fill="url(#pay-side)"/>
    <polygon points="70,96 102,84 178,108 146,96" fill="url(#pay-top)"/>
  </g>
  <rect x="80" y="108" width="56" height="34" rx="4" fill="url(#pay-screen)"/>
  <circle cx="92" cy="150" r="4" fill="#a7f3d0" opacity="0.9"/>
  <circle cx="108" cy="150" r="4" fill="#a7f3d0" opacity="0.9"/>
  <circle cx="124" cy="150" r="4" fill="#a7f3d0" opacity="0.9"/>
  <circle cx="92" cy="164" r="4" fill="#6b7280" opacity="0.8"/>
  <circle cx="108" cy="164" r="4" fill="#6b7280" opacity="0.8"/>
  <circle cx="124" cy="164" r="4" fill="#6b7280" opacity="0.8"/>
  <g filter="url(#ds)">
    <rect x="140" y="150" width="70" height="44" rx="7" fill="url(#pay-card)" transform="rotate(-8 140 150)"/>
  </g>
  <rect x="146" y="160" width="20" height="6" rx="2" fill="#ecfdf5" opacity="0.75" transform="rotate(-8 140 150)"/>
  <ellipse cx="152" cy="150" rx="14" ry="6" fill="#ffffff" opacity="0.2" transform="rotate(-8 140 150)"/>
  <g filter="url(#ds)">
    <circle cx="66" cy="184" r="15" fill="url(#pay-coin)"/>
  </g>
  <circle cx="66" cy="184" r="9" fill="none" stroke="#b45309" stroke-width="2" opacity="0.6"/>
  <ellipse cx="60" cy="178" rx="5" ry="3.5" fill="#fffbeb" opacity="0.6"/>
</svg>