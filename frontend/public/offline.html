<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef4444" />
    <title>Offline | BRO & BRO Food Court</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffaf0;
        color: #18181b;
        font-family: "Instrument Sans", system-ui, sans-serif;
      }

      .card {
        max-width: 420px;
        width: 100%;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(24, 24, 27, 0.1);
        padding: 28px;
        text-align: center;
      }

      .logo {
        width: 84px;
        height: 84px;
        margin: 0 auto 18px;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        margin: 12px 0 0;
        line-height: 1.6;
        color: #52525b;
      }

      a {
        display: inline-block;
        margin-top: 20px;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        text-decoration: none;
        padding: 12px 18px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">
        <img src="/bro-logo.png" alt="BRO & BRO Food Court" />
      </div>
      <h1>You are offline</h1>
      <p>The BRO & BRO Food Court app shell is available again once your connection returns.</p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
