# Production-only bootstrap, optional state bucket and hosted zone provisioning.
# Existing OIDC provider reused; no account-wide provider recreation.
# Inventory the target account before choosing either create flag.
# An existing role name causes a safe CloudFormation failure.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Console-only, one-time new account GitHub OIDC bootstrap for Bro and Bro PROD in
  Mumbai. Does not change existing production DNS or deploy the application.
Parameters:
  CreateStateBucket:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Set true only after verifying state bucket broandbro-tfstate-098859530205-ap-south-1
      is absent. False avoids duplicate resource creation.
  CreateHostedZone:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Set true only after verifying the replacement broandbro.in hosted zone
      is absent in this account. Does not change registrar delegation.
Conditions:
  CorrectAccount: !Equals [!Ref 'AWS::AccountId', '098859530205']
  CreateStateBucketCondition: !And
    - !Condition CorrectAccount
    - !Equals [!Ref CreateStateBucket, 'true']
  CreateHostedZoneCondition: !And
    - !Condition CorrectAccount
    - !Equals [!Ref CreateHostedZone, 'true']
Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    Condition: CreateStateBucketCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: broandbro-tfstate-098859530205-ap-south-1
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Purpose, Value: terraform-state}
  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateStateBucketCondition
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  NewAccountDNSZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateHostedZoneCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: broandbro.in
      HostedZoneTags:
        - {Key: Project, Value: broandbro}
        - {Key: Purpose, Value: preview-dns-zone}
  # The GitHub Actions OIDC provider already exists in this AWS account.
  # IAM identity providers are account-wide; reuse it rather than creating a duplicate.
  ProdTerraformRole:
    Type: AWS::IAM::Role
    Condition: CorrectAccount
    Properties:
      RoleName: broandbro-prod-terraform-github
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:operationReact/qrapp:environment:prod'
      Policies:
        - PolicyName: broandbro-prod-terraform-provision
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerraformProjectServices
                Effect: Allow
                Action:
                  - 'acm:*'
                  - 'cloudfront:*'
                  - 'cloudwatch:*'
                  - 'ec2:*'
                  - 'logs:*'
                  - 'rds:*'
                  - 'route53:*'
                  - 's3:*'
                  - 'sns:*'
                  - 'ssm:*'
                  - 'secretsmanager:DescribeSecret'
                  - 'scheduler:*'
                  - 'wafv2:*'
                  - 'kms:DescribeKey'
                  - 'kms:ListAliases'
                  - 'sts:GetCallerIdentity'
                Resource: '*'
              - Sid: ManageOnlyProdProjectIAM
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/broandbro-prod-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/broandbro-prod-*'
              - Sid: ReadAWSManagedPolicies
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListAttachedRolePolicies
                Resource: '*'
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Environment, Value: prod}
  ProdFrontendRole:
    Type: AWS::IAM::Role
    Condition: CorrectAccount
    Properties:
      RoleName: broandbro-prod-frontend-github
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:operationReact/qrapp:environment:prod'
      Policies:
        - PolicyName: broandbro-prod-frontend-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListFrontendBucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: arn:aws:s3:::broandbro-prod-ui-098859530205
              - Sid: UploadFrontendAssets
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: arn:aws:s3:::broandbro-prod-ui-098859530205/*
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: '*'
              - Sid: ReadDistributionId
                Effect: Allow
                Action: [ssm:GetParameter]
                Resource: arn:aws:ssm:ap-south-1:098859530205:parameter/broandbro/prod/cf-distribution-id
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Environment, Value: prod}
  ProdBackendRole:
    Type: AWS::IAM::Role
    Condition: CorrectAccount
    Properties:
      RoleName: broandbro-prod-backend-github
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:operationReact/qrapp:environment:prod'
      Policies:
        - PolicyName: broandbro-prod-backend-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadArtifactBucketName
                Effect: Allow
                Action: [ssm:GetParameter]
                Resource: arn:aws:ssm:ap-south-1:098859530205:parameter/broandbro/backend/prod/aws/s3/artifactBucketName
              - Sid: UploadArtifacts
                Effect: Allow
                Action: [s3:PutObject]
                Resource: arn:aws:s3:::broandbro-prod-artifacts-098859530205/deploy/prod/*
              - Sid: RunCommandsOnlyOnProdEC2
                Effect: Allow
                Action: [ssm:SendCommand]
                Resource: arn:aws:ec2:ap-south-1:098859530205:instance/*
                Condition:
                  StringEquals: {'aws:ResourceTag/Environment': prod}
              - Sid: ApprovedRunShellScript
                Effect: Allow
                Action: [ssm:SendCommand]
                Resource: arn:aws:ssm:ap-south-1::document/AWS-RunShellScript
              - Sid: InspectBackendDeployment
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ec2:DescribeInstances]
                Resource: '*'
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Environment, Value: prod}
Outputs:
  ActualAWSAccount:
    Description: Verify this matches 098859530205.
    Value: !Ref 'AWS::AccountId'
  TerraformStateBucket:
    Condition: CorrectAccount
    Description: Expected bucket name; existence must be verified separately.
    Value: broandbro-tfstate-098859530205-ap-south-1
  HostedZoneId:
    Condition: CreateHostedZoneCondition
    Value: !Ref NewAccountDNSZone
  NameserversNotYetDelegated:
    Condition: CreateHostedZoneCondition
    Value: !Join [', ', !GetAtt NewAccountDNSZone.NameServers]
  TerraformRoleArn:
    Condition: CorrectAccount
    Value: !GetAtt ProdTerraformRole.Arn
  FrontendRoleArn:
    Condition: CorrectAccount
    Value: !GetAtt ProdFrontendRole.Arn
  BackendRoleArn:
    Condition: CorrectAccount
    Value: !GetAtt ProdBackendRole.Arn
