AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Console-only, one-time new account GitHub OIDC bootstrap for Bro and Bro DEV in
  Mumbai. Does not change existing production DNS or deploy the application.
Conditions:
  CorrectAccount: !Equals [!Ref 'AWS::AccountId', '098859530205']
Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    Condition: CorrectAccount
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: broandbro-tfstate-098859530205-ap-south-1
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Purpose, Value: terraform-state}
  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CorrectAccount
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub '${StateBucket.Arn}/*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  NewAccountDNSZone:
    Type: AWS::Route53::HostedZone
    Condition: CorrectAccount
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: broandbro.in
      HostedZoneTags:
        - {Key: Project, Value: broandbro}
        - {Key: Purpose, Value: preview-dns-zone}
  # The GitHub Actions OIDC provider already exists in this AWS account.
  # IAM identity providers are account-wide; reuse it rather than creating a duplicate.
  DevTerraformRole:
    Type: AWS::IAM::Role
    Condition: CorrectAccount
    Properties:
      RoleName: broandbro-dev-terraform-github
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:operationReact/qrapp:environment:dev'
      Policies:
        - PolicyName: broandbro-dev-terraform-provision
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerraformProjectServices
                Effect: Allow
                Action:
                  - 'acm:*'
                  - 'cloudfront:*'
                  - 'cloudwatch:*'
                  - 'ec2:*'
                  - 'logs:*'
                  - 'rds:*'
                  - 'route53:*'
                  - 's3:*'
                  - 'sns:*'
                  - 'ssm:*'
                  - 'secretsmanager:DescribeSecret'
                  - 'scheduler:*'
                  - 'wafv2:*'
                  - 'kms:DescribeKey'
                  - 'kms:ListAliases'
                  - 'sts:GetCallerIdentity'
                Resource: '*'
              - Sid: ManageOnlyDevProjectIAM
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/broandbro-dev-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/broandbro-dev-*'
              - Sid: ReadAWSManagedPolicies
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListAttachedRolePolicies
                Resource: '*'
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Environment, Value: dev}
  DevFrontendRole:
    Type: AWS::IAM::Role
    Condition: CorrectAccount
    Properties:
      RoleName: broandbro-dev-frontend-github
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:operationReact/qrapp:environment:dev'
      Policies:
        - PolicyName: broandbro-dev-frontend-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListFrontendBucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: arn:aws:s3:::broandbro-dev-ui-098859530205
              - Sid: UploadFrontendAssets
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: arn:aws:s3:::broandbro-dev-ui-098859530205/*
              - Sid: InvalidateCloudFront
                Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: '*'
              - Sid: ReadDistributionId
                Effect: Allow
                Action: [ssm:GetParameter]
                Resource: arn:aws:ssm:ap-south-1:098859530205:parameter/broandbro/dev/cf-distribution-id
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Environment, Value: dev}
  DevBackendRole:
    Type: AWS::IAM::Role
    Condition: CorrectAccount
    Properties:
      RoleName: broandbro-dev-backend-github
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': 'repo:operationReact/qrapp:environment:dev'
      Policies:
        - PolicyName: broandbro-dev-backend-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadArtifactBucketName
                Effect: Allow
                Action: [ssm:GetParameter]
                Resource: arn:aws:ssm:ap-south-1:098859530205:parameter/broandbro/backend/dev/aws/s3/artifactBucketName
              - Sid: UploadArtifacts
                Effect: Allow
                Action: [s3:PutObject]
                Resource: arn:aws:s3:::broandbro-dev-artifacts-098859530205/deploy/dev/*
              - Sid: RunCommandsOnlyOnDevEC2
                Effect: Allow
                Action: [ssm:SendCommand]
                Resource: arn:aws:ec2:ap-south-1:098859530205:instance/*
                Condition:
                  StringEquals: {'aws:ResourceTag/Environment': dev}
              - Sid: ApprovedRunShellScript
                Effect: Allow
                Action: [ssm:SendCommand]
                Resource: arn:aws:ssm:ap-south-1::document/AWS-RunShellScript
              - Sid: InspectBackendDeployment
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ec2:DescribeInstances]
                Resource: '*'
      Tags:
        - {Key: Project, Value: broandbro}
        - {Key: Environment, Value: dev}
Outputs:
  ActualAWSAccount:
    Description: Verify this matches 098859530205.
    Value: !Ref 'AWS::AccountId'
  TerraformStateBucket:
    Condition: CorrectAccount
    Value: !Ref StateBucket
  HostedZoneId:
    Condition: CorrectAccount
    Value: !Ref NewAccountDNSZone
  NameserversNotYetDelegated:
    Condition: CorrectAccount
    Value: !Join [', ', !GetAtt NewAccountDNSZone.NameServers]
  TerraformRoleArn:
    Condition: CorrectAccount
    Value: !GetAtt DevTerraformRole.Arn
  FrontendRoleArn:
    Condition: CorrectAccount
    Value: !GetAtt DevFrontendRole.Arn
  BackendRoleArn:
    Condition: CorrectAccount
    Value: !GetAtt DevBackendRole.Arn
