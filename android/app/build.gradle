plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseSigningValue = { String key, String envKey ->
    System.getenv(envKey) ?: keystoreProperties.getProperty(key)
}
def releaseStoreFile = releaseSigningValue("storeFile", "BROBRO_UPLOAD_STORE_FILE")
def releaseSigningReady = releaseStoreFile != null &&
        rootProject.file(releaseStoreFile).exists() &&
        releaseSigningValue("storePassword", "BROBRO_UPLOAD_STORE_PASSWORD") != null &&
        releaseSigningValue("keyAlias", "BROBRO_UPLOAD_KEY_ALIAS") != null &&
        releaseSigningValue("keyPassword", "BROBRO_UPLOAD_KEY_PASSWORD") != null

android {
    namespace "in.broandbro.app"
    compileSdk 36

    defaultConfig {
        applicationId "in.broandbro.app"
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("BROBRO_VERSION_CODE") ?: "1")
        versionName System.getenv("BROBRO_VERSION_NAME") ?: "1.0.0"
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseSigningValue("storePassword", "BROBRO_UPLOAD_STORE_PASSWORD")
                keyAlias releaseSigningValue("keyAlias", "BROBRO_UPLOAD_KEY_ALIAS")
                keyPassword releaseSigningValue("keyPassword", "BROBRO_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseArtifactTasks = graph.allTasks.findAll { it.name ==~ /(assemble|bundle|package)Release/ }
    if (!releaseArtifactTasks.isEmpty() && !releaseSigningReady) {
        throw new GradleException(
            "Release signing is not configured. Create android/keystore.properties (see android/keystore.properties.example) " +
            "or set BROBRO_UPLOAD_STORE_FILE, BROBRO_UPLOAD_STORE_PASSWORD, BROBRO_UPLOAD_KEY_ALIAS and BROBRO_UPLOAD_KEY_PASSWORD. " +
            "Refusing to build an unsigned or debug-signed release artifact.")
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.3"
    implementation "androidx.browser:browser:1.10.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
