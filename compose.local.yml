services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: broandbro_local
      POSTGRES_USER: broandbro_local
      POSTGRES_PASSWORD: brobro-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brobro_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broandbro_local -d broandbro_local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  brobro_local_data:
