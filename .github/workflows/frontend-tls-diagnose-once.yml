name: One-time Bro and Bro preview HTTPS diagnostics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-tls-diagnose-once.yml"
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Check DNS, EC2 IP and HTTP externally
        env:
          ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT"
          IP="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].PublicIpAddress' --output text)"
          echo "Expected EC2 IP: $IP"
          echo "Public DNS A records:"
          dig +short migrate-prod.broandbro.in A || true
          echo "Public DNS NS records:"
          dig +short broandbro.in NS || true
          echo "Direct EC2 HTTP:"
          curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w 'EC2 HTTP %{http_code}\n' --resolve "migrate-prod.broandbro.in:80:$IP" http://migrate-prod.broandbro.in/ || true
          echo "Public HTTP:"
          curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w 'DNS HTTP %{http_code}\n' http://migrate-prod.broandbro.in/ || true
      - name: Inspect Nginx and Certbot on EC2 via SSM
        run: |
          set -euo pipefail
          INSTANCE="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]]
          COMMAND='echo "NGINX SERVER CONFIG"; nginx -T 2>&1 | grep -E "server_name|listen 80|root /var/www" | tail -n 35; echo "FRONTEND LOCAL HTTP"; curl -sS -o /dev/null -w "%{http_code}\n" -H "Host: migrate-prod.broandbro.in" http://127.0.0.1/ || true; echo "CERTBOT ERRORS"; grep -Ei "Detail:|unauthorized|connection refused|timeout during connect|DNS problem|Invalid response|Some challenges have failed" /var/log/letsencrypt/letsencrypt.log | tail -n 18 || true'
          python3 -c 'import json,sys; json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' "$COMMAND" "$RUNNER_TEMP/diag.json"
          CID="$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/diag.json" --query Command.CommandId --output text)"
          for i in $(seq 1 35); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE" --query '{Status:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                test "$STATUS" = Success
                exit
                ;;
            esac
            sleep 5
          done
          exit 1

      - name: Inspect Route53 hosted zone and preview A record (read only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Compare configured Route53 delegation with public nameservers
        run: |
          set -euo pipefail
          ZONE="$(aws route53 list-hosted-zones-by-name --dns-name broandbro.in --query 'HostedZones[?Name==`broandbro.in.`].Id | [0]' --output text)"
          test -n "$ZONE" && test "$ZONE" != None
          echo "Configured hosted zone: $ZONE"
          echo "Route53 assigned NS:"
          aws route53 get-hosted-zone --id "$ZONE" --query 'DelegationSet.NameServers' --output json
          echo "Route53 preview A record:"
          aws route53 list-resource-record-sets --hosted-zone-id "$ZONE" --query 'ResourceRecordSets[?Name==`migrate-prod.broandbro.in.`]' --output json
          echo "Public nameservers:"
          dig +short broandbro.in NS
          echo "Preview from public authoritative nameservers:"
          for NS in $(dig +short broandbro.in NS); do echo "$NS"; dig +time=2 +tries=1 +short @"$NS" migrate-prod.broandbro.in A || true; done
