name: One-time read-only DNS recovery plan
on:
  push:
    branches: [main]
    paths: [.github/workflows/dns-recovery-plan-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run terraform-plan.yml --repo "$GITHUB_REPOSITORY" --ref main
