# =============================================================================
# Workflow: frontend-deploy-dev.yml
# Triggered by push to `dev` branch when frontend/** changes.
# Builds the Vite app and deploys to the DEV S3 bucket + CloudFront.
# =============================================================================
name: Frontend Deploy-Dev

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: "ap-south-1"
  S3_BUCKET: "broandbro-dev-ui-${{ vars.AWS_NEW_ACCOUNT_ID }}"
  # NOTE: CF_DISTRIBUTION_ID cannot be set here from secrets – referenced directly in the step below
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-frontend-dev:
    if: github.ref == 'refs/heads/dev'
    name: Build & Deploy Frontend – Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate new-account preview API URL before building
        env:
          API_URL: ${{ vars.API_URL }}
          ACCOUNT_ID: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::New AWS account is not configured"; exit 1; }
          if [[ "$API_URL" != "https://migrate-dev-api.broandbro.in" ]]; then
            echo "::error::Expected the new-account dev preview API URL; refusing build"
            exit 1
          fi

      - name: Install locked dependencies (reproducible)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Vite app
        working-directory: frontend
        run: npm run build
        env:
          # Vite bakes VITE_* env vars into the bundle at build time.
          # This is the single source of truth for the API URL in the dev deployment.
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_ENV: "dev"
          NODE_ENV: "production"

      - name: Verify built bundle API target (fail closed)
        working-directory: frontend
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          if ! grep -FRq -- "$API_URL" dist/assets; then
            echo "::error::Expected API_URL missing from frontend bundle; aborting deployment"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Guard new AWS account for migration
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          test -n "$EXPECTED_ACCOUNT" || { echo "::error::New-account ID missing"; exit 1; }
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL" = "$EXPECTED_ACCOUNT" || { echo "::error::Refusing old AWS account"; exit 1; }

      # ── Upload to S3 ──────────────────────────────────────────────────────
      # Strategy:
      #   /assets/*  → long cache (Vite appends content hash to filename)
      #   index.html → no cache (always fetch latest shell)
      #   everything else → short cache

      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload remaining files (short cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=3600" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --delete

      - name: Upload PWA and app-link files
        run: |
          aws s3 cp frontend/dist/manifest.webmanifest s3://${{ env.S3_BUCKET }}/manifest.webmanifest \
            --content-type "application/manifest+json" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/sw.js s3://${{ env.S3_BUCKET }}/sw.js \
            --content-type "application/javascript" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/favicon.svg s3://${{ env.S3_BUCKET }}/favicon.svg \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/offline.html s3://${{ env.S3_BUCKET }}/offline.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/apple-touch-icon.png s3://${{ env.S3_BUCKET }}/apple-touch-icon.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-192.png s3://${{ env.S3_BUCKET }}/pwa-192.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-512.png s3://${{ env.S3_BUCKET }}/pwa-512.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-maskable-512.png s3://${{ env.S3_BUCKET }}/pwa-maskable-512.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/.well-known/assetlinks.json s3://${{ env.S3_BUCKET }}/.well-known/assetlinks.json \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

      # ── CloudFront cache invalidation ────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          CF_DIST_ID=$(aws ssm get-parameter \
            --name "/broandbro/dev/cf-distribution-id" \
            --query "Parameter.Value" \
            --output text)

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "Frontend deployed to https://migrate-dev.broandbro.in" >> "$GITHUB_STEP_SUMMARY"
