name: PROD Terraform Offline Validate (No AWS Credentials)

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init without remote state or credentials
        working-directory: infra/environments/prod
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: infra/environments/prod
        run: terraform validate -no-color

  migration-scripts:
    name: Migration scripts / security regression checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse Python migration tools and EC2 deployment agent
        run: python3 -m py_compile scripts/migrate-s3-media.py scripts/deploy-backend-from-ssm.py scripts/preflight-new-account.py
      - name: Unit-test AWS migration and preflight protections (offline)
        run: |
          python3 -m pip install --quiet boto3
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate console-only CloudFormation OIDC bootstrap
        run: |
          python3 -m pip install --quiet cfn-lint
          cfn-lint infra/cloudformation/github-oidc-bootstrap-prod-only.yaml
      - name: Enforce production-only OIDC bootstrap guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("infra/cloudformation/github-oidc-bootstrap-prod-only.yaml").read_text()
          assert "environment:prod" in p and p.count("environment:prod") == 3
          assert "environment:dev" not in p
          assert "AWS::IAM::OIDCProvider" not in p
          assert p.count("Type: AWS::IAM::Role") == 3
          assert "CreateStateBucketCondition" in p and "CreateHostedZoneCondition" in p
          assert p.count("Default: 'false'") == 2
          PY
      - name: Assert production state bucket region is not confused with Mumbai resource region
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path(".github/workflows/terraform-plan.yml"),
              Path(".github/workflows/terraform-apply-prod.yml"),
          ]
          for path in paths:
              wf = path.read_text()
              assert "TF_STATE_BUCKET_REGION" in wf, path
              assert "--expected-bucket-owner" in wf, path
              assert "get-bucket-location" in wf, path
              assert '-backend-config="region=$TF_STATE_BUCKET_REGION"' in wf, path
              assert 'AWS_NEW_ACCOUNT_ID' in wf, path
          assert "TF_STATE_BUCKET_REGION=us-east-1" in Path("infra/PROD_ONLY_MIGRATION_P0.md").read_text()
          PY
      - name: Validate GitHub Actions YAML semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck=
      - name: Check Bash script syntax
        run: |
          for script in scripts/bootstrap-new-account.sh \
                        scripts/cloudshell-bootstrap.sh \
                        scripts/configure-github-environments.sh \
                        scripts/set-external-ssm-parameter.sh \
                        scripts/migrate-external-ssm.sh \
                        scripts/mirror-route53-records.sh; do
            bash -n "$script"
          done
      - name: Prevent insecure seed passwords or default admin login regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          security = Path("backend/src/main/java/com/broandbro/qrapp/config/SecurityConfig.java").read_text()
          assert 'app.admin.password:123' not in security
          migration = Path("backend/src/main/resources/db/migration/V167__disable_insecure_seeded_logins.sql").read_text()
          for phone in ("9000000001", "9999999999", "9888888888", "9000000099", "7093327979"):
              assert phone in migration
          assert "active = FALSE" in migration and "must_change_password = TRUE" in migration
          PY
      - name: Block legacy AWS static-key workflows
        run: |
          for workflow in .github/workflows/*.yml; do
            [ "$workflow" = ".github/workflows/terraform-validate.yml" ] && continue
            if grep -E 'aws-access-key-id:|aws-secret-access-key:' "$workflow"; then
              echo "::error::Long-lived AWS credentials are forbidden in GitHub workflows."
              exit 1
            fi
          done
      - name: Block DEV deployment workflows and Terraform apply on push
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path(".github/workflows")
          bad = [
              "backend-deploy-dev.yml", "frontend-deploy-dev.yml",
              "terraform-apply-dev.yml", "acm-prepare-dev.yml",
              "aws-oidc-verify-dev.yml", "terraform-deploy.yml",
          ]
          assert all(not (wf / p).exists() for p in bad), "DEV/legacy workflow still exists"
          for name in ("terraform-apply-prod.yml", "backend-deploy-prod.yml", "frontend-deploy-prod.yml"):
              x = (wf / name).read_text()
              assert "workflow_dispatch:" in x and "\\n  push:" not in x, name
              assert "refs/heads/main" in x, name
          plan = (wf / "terraform-plan.yml").read_text()
          assert "infra/environments/prod" in plan and "environment: prod" in plan
          assert "refs/heads/main" in plan and "workflow_dispatch:" in plan
          assert "infra/environments/dev" not in plan
          PY
