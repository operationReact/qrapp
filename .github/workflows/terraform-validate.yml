name: Terraform Offline Validate (No AWS Credentials)

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init without remote state or credentials
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate -no-color

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init bootstrap offline
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false
      - name: Validate account bootstrap
        working-directory: infra/bootstrap
        run: terraform validate -no-color
