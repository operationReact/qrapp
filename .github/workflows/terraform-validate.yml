name: Terraform Offline Validate (No AWS Credentials)

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init without remote state or credentials
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate -no-color

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init bootstrap offline
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false
      - name: Validate account bootstrap
        working-directory: infra/bootstrap
        run: terraform validate -no-color

  migration-scripts:
    name: Migration scripts / security regression checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse Python migration tools and EC2 deployment agent
        run: python3 -m py_compile scripts/migrate-s3-media.py scripts/deploy-backend-from-ssm.py scripts/preflight-new-account.py
      - name: Validate GitHub Actions YAML semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck=
      - name: Check Bash script syntax
        run: |
          for script in scripts/bootstrap-new-account.sh \
                        scripts/configure-github-environments.sh \
                        scripts/set-external-ssm-parameter.sh \
                        scripts/migrate-external-ssm.sh \
                        scripts/mirror-route53-records.sh; do
            bash -n "$script"
          done
      - name: Block legacy AWS static-key workflows
        run: |
          for workflow in .github/workflows/*.yml; do
            [ "$workflow" = ".github/workflows/terraform-validate.yml" ] && continue
            if grep -E 'aws-access-key-id:|aws-secret-access-key:' "$workflow"; then
              echo "::error::Long-lived AWS credentials are forbidden in GitHub workflows."
              exit 1
            fi
          done
      - name: Ensure CI backend role cannot read application secrets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("infra/bootstrap/bootstrap.tf").read_text()
          role = text.split('resource "aws_iam_role_policy" "backend" {', 1)[1].split('output "account_id"', 1)[0]
          assert "ReadArtifactBucketNameOnly" in role
          assert "secretsmanager:GetSecretValue" not in role
          assert "ssm:GetParametersByPath" not in role
          assert "ec2:RebootInstances" not in role
          PY
      - name: Enforce environment-isolated Systems Manager deployments
        run: |
          grep -Fq 'RunCommandsOnlyOnOwnEnvironment' infra/bootstrap/bootstrap.tf
          grep -Fq 'aws:ResourceTag/Environment' infra/bootstrap/bootstrap.tf
          grep -Fq 'UseApprovedSSMDocument' infra/bootstrap/bootstrap.tf
      - name: Block dangerous bootstrap role regressions
        run: |
          if grep -R --include='*.tf' -E 'policy/AdministratorAccess|repo:\\*/\\*' infra/; then
            echo "::error::Wild-card GitHub OIDC trust or AdministratorAccess is forbidden."
            exit 1
          fi
