name: Terraform Offline Validate (No AWS Credentials)

on:
  push:
    branches: [dev, main]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init without remote state or credentials
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform validate -no-color

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Init bootstrap offline
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false
      - name: Validate account bootstrap
        working-directory: infra/bootstrap
        run: terraform validate -no-color

  migration-scripts:
    name: Migration scripts / security regression checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse Python migration tools and EC2 deployment agent
        run: python3 -m py_compile scripts/migrate-s3-media.py scripts/deploy-backend-from-ssm.py scripts/preflight-new-account.py
      - name: Unit-test AWS migration and preflight protections (offline)
        run: |
          python3 -m pip install --quiet boto3
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate console-only CloudFormation OIDC bootstrap
        run: |
          python3 -m pip install --quiet cfn-lint
          cfn-lint infra/cloudformation/github-oidc-bootstrap-dev.yaml \
                   infra/cloudformation/github-oidc-bootstrap-prod.yaml
      - name: Enforce production-only bootstrap trust and account guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path("infra/cloudformation/github-oidc-bootstrap-prod.yaml").read_text()
          assert t.count("repo:operationReact/qrapp:environment:prod") == 3
          assert "environment:dev" not in t and "broandbro-dev-" not in t
          assert "AWS::IAM::OIDCProvider" not in t, "reuse the account-wide OIDC provider"
          assert "Rules:" in t and "098859530205" in t
          assert "AdministratorAccess" not in t
          assert "ec2:CreateNatGateway" in t
          PY
      - name: Enforce hard-coded new account in every production workflow
        run: |
          for wf in terraform-plan terraform-apply-prod acm-prepare-prod aws-inventory-prod \
                    frontend-deploy-prod backend-deploy-prod; do
            grep -Fq '098859530205' ".github/workflows/$wf.yml" || {
              echo "::error::$wf.yml must hard-code the new account 098859530205"; exit 1; }
          done
          grep -Fq 'require-issued-prod-acm-cert.sh' .github/workflows/terraform-plan.yml
          grep -Fq 'require-issued-prod-acm-cert.sh' .github/workflows/terraform-apply-prod.yml
          ! grep -E '^\s*alarm_email\s*=' infra/environments/prod/terraform.tfvars
      - name: Keep DEV AWS workflows non-operational (production-only decision)
        run: |
          for wf in terraform-apply-dev frontend-deploy-dev backend-deploy-dev acm-prepare-dev aws-oidc-verify-dev; do
            grep -Fq 'Refuse - production-only AWS decision' ".github/workflows/$wf.yml" || {
              echo "::error::$wf.yml must keep its prod-only refusal step"; exit 1; }
          done
      - name: Validate GitHub Actions YAML semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck=
      - name: Check Bash script syntax
        run: |
          for script in scripts/bootstrap-new-account.sh \
                        scripts/cloudshell-bootstrap.sh \
                        scripts/configure-github-environments.sh \
                        scripts/set-external-ssm-parameter.sh \
                        scripts/migrate-external-ssm.sh \
                        scripts/mirror-route53-records.sh \
                        scripts/require-issued-prod-acm-cert.sh \
                        scripts/summarize-terraform-plan.sh; do
            bash -n "$script"
          done
      - name: Prevent insecure seed passwords or default admin login regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          security = Path("backend/src/main/java/com/broandbro/qrapp/config/SecurityConfig.java").read_text()
          assert 'app.admin.password:123' not in security
          migration = Path("backend/src/main/resources/db/migration/V167__disable_insecure_seeded_logins.sql").read_text()
          for phone in ("9000000001", "9999999999", "9888888888", "9000000099", "7093327979"):
              assert phone in migration
          assert "active = FALSE" in migration and "must_change_password = TRUE" in migration
          PY
      - name: Block legacy AWS static-key workflows
        run: |
          for workflow in .github/workflows/*.yml; do
            [ "$workflow" = ".github/workflows/terraform-validate.yml" ] && continue
            if grep -E 'aws-access-key-id:|aws-secret-access-key:' "$workflow"; then
              echo "::error::Long-lived AWS credentials are forbidden in GitHub workflows."
              exit 1
            fi
          done
      - name: Ensure CI backend role cannot read application secrets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("infra/bootstrap/bootstrap.tf").read_text()
          role = text.split('resource "aws_iam_role_policy" "backend" {', 1)[1].split('output "account_id"', 1)[0]
          assert "ReadArtifactBucketNameOnly" in role
          assert "secretsmanager:GetSecretValue" not in role
          assert "ssm:GetParametersByPath" not in role
          assert "ec2:RebootInstances" not in role
          PY
      - name: Enforce environment-isolated Systems Manager deployments
        run: |
          grep -Fq 'RunCommandsOnlyOnOwnEnvironment' infra/bootstrap/bootstrap.tf
          grep -Fq 'aws:ResourceTag/Environment' infra/bootstrap/bootstrap.tf
          grep -Fq 'UseApprovedSSMDocument' infra/bootstrap/bootstrap.tf
      - name: Block dangerous bootstrap role regressions
        run: |
          if grep -R --include='*.tf' -E 'policy/AdministratorAccess|repo:\\*/\\*' infra/; then
            echo "::error::Wild-card GitHub OIDC trust or AdministratorAccess is forbidden."
            exit 1
          fi
