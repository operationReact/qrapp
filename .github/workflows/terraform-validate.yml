name: PROD Terraform Offline Validate (No AWS Credentials)

# Code validation only. This workflow does not assume an AWS role or provision resources.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Terraform init offline (no backend state)
        working-directory: infra/environments/prod
        run: terraform init -backend=false -input=false
      - name: Validate production Terraform
        working-directory: infra/environments/prod
        run: terraform validate -no-color
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production CloudFormation only
        run: |
          python3 -m pip install --quiet cfn-lint
          cfn-lint infra/cloudformation/github-oidc-bootstrap-prod-only.yaml
      - name: Block DEV deployment definitions and static AWS keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert not Path("infra/environments/dev").exists()
          assert not Path("infra/bootstrap/bootstrap.tf").exists()
          flows = Path(".github/workflows")
          assert not list(flows.glob("*-dev.yml"))
          for file in flows.glob("*.yml"):
              text = file.read_text()
              for forbidden in ("aws-access" + "-key-id:", "aws-secret" + "-access-key:"):
                  assert forbidden not in text, file
          for name in ("backend-deploy-prod.yml", "frontend-deploy-prod.yml", "terraform-apply-prod.yml"):
              text = (flows / name).read_text()
              assert "workflow_dispatch:" in text, name
              assert "\\n  push:" not in text, name
              assert "refs/heads/main" in text, name
          plan = (flows / "terraform-plan.yml").read_text()
          assert "infra/environments/prod" in plan
          assert "infra/environments/dev" not in plan
          assert "refs/heads/main" in plan
          PY
      - name: Validate read-only recovery scripts and address matching (no AWS)
        run: |
          python3 -m py_compile scripts/audit-prod-terraform-state.py scripts/audit-prod-terraform-recovery.py scripts/audit-prod-ssm.py scripts/inspect-prod-s3-state-recovery.py scripts/audit_prod_helpers.py scripts/reconcile-prod-s3-state.py scripts/untaint-prod-ec2-role.py scripts/enforce-prod-nondestructive-plan.py
          python3 scripts/test-prod-s3-state-recovery.py
          python3 - <<'PY'
          import json
          import runpy
          funcs = runpy.run_path("scripts/audit-prod-terraform-state.py")
          fake_state = {"resources": [
              {"mode": "managed", "type": "terraform_data", "name": "account_guard", "instances": [{}]},
              {"mode": "managed", "module": "module.test", "type": "aws_ssm_parameter",
               "name": "external", "instances": [{"index_key": "razorpay/key"}]},
              {"mode": "managed", "module": "module.network", "type": "aws_subnet",
               "name": "private", "instances": [{"index_key": 0}, {"index_key": 1}]}
          ]}
          actual = funcs["state_addresses"](fake_state)
          expected = {
              "terraform_data.account_guard",
              'module.test.aws_ssm_parameter.external["razorpay/key"]',
              "module.network.aws_subnet.private[0]",
              "module.network.aws_subnet.private[1]"
          }
          assert actual == expected, (actual, expected)
          manifest = json.load(open("scripts/prod-apply-43712225552-completed.json", encoding="utf-8"))
          entries = manifest["completed_resource_addresses"]
          assert len(entries) == len(set(entries)) == 65
          actions = runpy.run_path("scripts/enforce-prod-nondestructive-plan.py")["audit_plan"]
          assert actions({"resource_changes": [{"address": "module.one.aws_s3_bucket.this",
               "change": {"actions": ["create"]}}]}) == (1, [])
          assert len(actions({"resource_changes": [{"address": "module.one.aws_iam_role.this",
               "change": {"actions": ["delete", "create"]}}]})[1]) == 1
          PY
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck=
