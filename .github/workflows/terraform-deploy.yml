name: Legacy Terraform deployment (disabled)

# Disabled during AWS account migration. Use the account-guarded Terraform
# Apply - New Account DEV/PROD workflows instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy static-key deployment
        run: |
          echo "::error::This legacy deployment used static credentials and is disabled."
          echo "Use the account-guarded Terraform Apply workflow after the new-account bootstrap."
          exit 1
