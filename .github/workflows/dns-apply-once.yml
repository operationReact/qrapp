name: One-time guarded new-account DNS staging apply
on:
  push:
    branches: [main]
    paths: [.github/workflows/dns-apply-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing guarded production Apply for 6 DNS-only additions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run terraform-apply-prod.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            --field confirm=APPLY_NEW_PROD \
            --field recovery_confirm=STATE_RECONCILED
