# Activates HTTPS on the already-staged React SPA without changing public DNS or main domains.
name: Activate BroBro preview frontend HTTPS after DNS verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-preview-frontend-https.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: broandbro-preview-frontend-https
  cancel-in-progress: false

jobs:
  preview-frontend-https:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Assume production backend role (SSM)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Validate AWS account and EC2 target
        id: target
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$EXPECTED_ACCOUNT" = "098859530205"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]] || { echo "::error::Expected one running new-account EC2"; exit 1; }
          IP="$(aws ec2 describe-instances --instance-ids "$INSTANCE" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
          [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Missing EC2 public IP"; exit 1; }
          echo "instance=$INSTANCE" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Confirm SPA can be reached directly on new EC2 (DNS bypassed)
        env:
          IP: ${{ steps.target.outputs.ip }}
        run: |
          curl --noproxy '*' --fail --location --silent --show-error --max-time 15 \
            --resolve "migrate-prod.broandbro.in:80:$IP" \
            --resolve "migrate-prod.broandbro.in:443:$IP" \
            http://migrate-prod.broandbro.in/ >/dev/null
          echo "New-account frontend direct HTTP/HTTPS smoke check passed"

      - name: Require matching public preview DNS before Certbot
        id: dns
        env:
          IP: ${{ steps.target.outputs.ip }}
        run: |
          set -euo pipefail
          A1="$(dig +short A migrate-prod.broandbro.in @1.1.1.1 | sort -u || true)"
          A2="$(dig +short A migrate-prod.broandbro.in @8.8.8.8 | sort -u || true)"
          if [[ "$A1" == "$IP" && "$A2" == "$IP" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Preview frontend DNS points at new account EC2 on both resolvers."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Public frontend preview DNS is not ready for TLS; leaving HTTPS untouched."
          fi

      - name: Activate HTTPS on explicit preview SPA Nginx host
        if: steps.dns.outputs.ready == 'true'
        env:
          INSTANCE: ${{ steps.target.outputs.instance }}
        run: |
          set -euo pipefail
          COMMAND="set -euo pipefail; test -s /var/www/broandbro/index.html; nginx -t; certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d migrate-prod.broandbro.in --redirect; nginx -t; curl --fail --silent --show-error --max-time 15 --resolve migrate-prod.broandbro.in:443:127.0.0.1 https://migrate-prod.broandbro.in/ >/dev/null"
          python3 -c 'import json,sys;json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/frontend-preview-https.json"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/frontend-preview-https.json" \
            --timeout-seconds 900 \
            --comment "broandbro-preview-frontend-tls-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                curl --fail --silent --show-error --max-time 15 https://migrate-prod.broandbro.in/ >/dev/null
                echo "Public preview SPA HTTPS verified"
                exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent}' --output json || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Frontend preview HTTPS SSM command timed out"; exit 1

      - name: Final readiness summary
        run: |
          echo "## New-account preview React frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct EC2 frontend reachability: passed" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.dns.outputs.ready }}" == "true" ]]; then
            echo "- Public HTTPS preview: verified at https://migrate-prod.broandbro.in" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Public HTTPS preview: blocked by DNS; no certificate attempted" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Live apex/www cutover: not performed" >> "$GITHUB_STEP_SUMMARY"
