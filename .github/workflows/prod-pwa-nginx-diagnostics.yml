# Read-only new-account EC2 Nginx MIME diagnostics. No configuration writes.
name: Diagnose BroBro prod PWA manifest Nginx response
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-pwa-nginx-diagnostics.yml"
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Collect targeted Nginx MIME configuration and local HTTPS headers (read only)
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_ACCOUNT" = 098859530205
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]] || exit 1
          COMMAND="set -e; echo NGINX_MIME_ENTRIES; grep -nE 'webmanifest|manifest\\+json|types[[:space:]]*\\{' /etc/nginx/mime.types | head -20 || true; echo NGINX_CONFIG_RELEVANT; nginx -T 2>&1 | grep -Ei 'configuration file|include .*mime|server_name|default_type|webmanifest|manifest\\+json|location /|proxy_pass|types[[:space:]]*\\{' | head -100 || true; echo FILES; ls -l /var/www/broandbro/manifest.webmanifest || true; for HOST in broandbro.in www.broandbro.in migrate-prod.broandbro.in; do echo HOST_\$HOST; curl --noproxy '*' -ksSI --max-time 10 --resolve \$HOST:443:127.0.0.1 https://\$HOST/manifest.webmanifest | grep -Ei '^HTTP/|^content-type:|^server:' || true; done"
          python3 -c 'import json,sys;json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/diagnose.json"
          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/diagnose.json" \
            --timeout-seconds 90 --comment "brobro-pwa-mime-readonly-$GITHUB_RUN_ID" \
            --query Command.CommandId --output text)"
          for ATTEMPT in $(seq 1 40); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Output:StandardOutputContent}' --output json
                exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                exit 1 ;;
            esac
            sleep 3
          done
          exit 1
