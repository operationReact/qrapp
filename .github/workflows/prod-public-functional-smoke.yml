# Public read-only smoke: tests browser-facing readiness, unlike TCP/actuator-only checks.
name: Check BroBro public website API CORS and PWA readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-public-functional-smoke.yml"

permissions:
  contents: read

jobs:
  public-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test public website and Android PWA resources
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            https://broandbro.in/ \
            https://www.broandbro.in/ \
            https://broandbro.in/manifest.webmanifest \
            https://broandbro.in/.well-known/assetlinks.json \
            https://api.broandbro.in/actuator/health; do
            CODE="$(curl --noproxy '*' --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$URL" || true)"
            echo "$URL -> $CODE"
            echo "- $URL: HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$CODE" != "200" ]]; then
              echo "::error::Required public endpoint failed ($CODE): $URL"
              exit 1
            fi
          done
          curl --noproxy '*' --fail --silent --show-error --max-time 20 \
            https://broandbro.in/.well-known/assetlinks.json \
            | python3 -c 'import json,sys; v=json.load(sys.stdin); assert isinstance(v,list), "assetlinks.json must be a JSON array"'
          echo "Android assetlinks JSON parses successfully"

      - name: Verify Android App Links and PWA content matches the approved repository release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          def public_get(path):
              req = urllib.request.Request(
                  "https://broandbro.in" + path,
                  headers={"User-Agent": "BroBro-release-readiness/1.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.headers.get_content_type(), resp.read()

          approved = json.loads(Path("frontend/public/.well-known/assetlinks.json").read_text())
          content_type, live_data = public_get("/.well-known/assetlinks.json")
          live = json.loads(live_data)
          assert content_type == "application/json", f"Android assetlinks served as {content_type}"
          assert live == approved, "Public assetlinks differ from approved GitHub release"
          assert isinstance(live, list) and live, "Android Digital Asset Links cannot be empty"
          valid_fp = re.compile(r"(?:[0-9A-F]{2}:){31}[0-9A-F]{2}\Z")
          matches = [
              record for record in live
              if "delegate_permission/common.handle_all_urls" in record.get("relation", [])
              and record.get("target", {}).get("namespace") == "android_app"
              and record.get("target", {}).get("package_name") == "in.broandbro.app"
              and record.get("target", {}).get("sha256_cert_fingerprints")
              and all(valid_fp.fullmatch(fp) for fp in record["target"]["sha256_cert_fingerprints"])
          ]
          assert matches, "Missing valid in.broandbro.app Digital Asset Links declaration"
          print("Android Digital Asset Links package, fingerprints and release integrity: PASS")

          content_type, live_manifest_data = public_get("/manifest.webmanifest")
          assert content_type in {"application/manifest+json", "application/json"}, f"Unexpected PWA MIME: {content_type}"
          live_manifest = json.loads(live_manifest_data)
          approved_manifest = json.loads(Path("frontend/public/manifest.webmanifest").read_text())
          assert live_manifest == approved_manifest, "Public PWA manifest differs from approved GitHub release"
          assert live_manifest.get("display") == "standalone"
          assert live_manifest.get("start_url") == "/" and live_manifest.get("scope") == "/"
          sizes = {icon.get("sizes") for icon in live_manifest.get("icons", [])}
          assert {"192x192", "512x512"} <= sizes, "Required PWA icon sizes missing"
          print("PWA manifest MIME, display mode, icons and release integrity: PASS")

          for icon_path in ("/pwa-192.png", "/pwa-512.png", "/pwa-maskable-512.png"):
              mime, data = public_get(icon_path)
              assert mime == "image/png" and data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"), (
                  f"Missing or invalid PNG icon: {icon_path} ({mime})"
              )
              print(f"PWA icon valid: {icon_path}")
          PY
          echo "- Android App Links: JSON content, package, fingerprints, release integrity checked" >> "$GITHUB_STEP_SUMMARY"
          echo "- PWA manifest and real PNG assets: validated" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify actual browser CORS preflight for main and preview origins
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          echo "## Browser API CORS preflight" >> "$GITHUB_STEP_SUMMARY"
          for ORIGIN in \
            https://broandbro.in \
            https://www.broandbro.in \
            https://migrate-prod.broandbro.in; do
            HEADERS="$(mktemp)"
            CODE="$(curl --noproxy '*' --silent --show-error --max-time 20 \
              -X OPTIONS -D "$HEADERS" -o /dev/null -w '%{http_code}' \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: GET' \
              https://api.broandbro.in/menu || true)"
            ALLOWED="$(grep -i '^access-control-allow-origin:' "$HEADERS" | tail -n 1 | tr -d '\r' | cut -d ':' -f 2- | xargs || true)"
            rm -f "$HEADERS"
            if [[ "$CODE" =~ ^2[0-9][0-9]$ && "$ALLOWED" == "$ORIGIN" ]]; then
              echo "$ORIGIN preflight passed (HTTP $CODE)"
              echo "- $ORIGIN: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::CORS preflight blocked $ORIGIN: status=$CODE allowedOrigin=$ALLOWED"
              echo "- $ORIGIN: FAILED (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      - name: Snapshot public mail routing and email policy (read-only)
        if: always()
        shell: bash
        run: |
          echo "## Public email DNS (informational; DKIM requires selector inventory)" >> "$GITHUB_STEP_SUMMARY"
          MX="$(dig +short MX broandbro.in @1.1.1.1 | paste -sd ';' - || true)"
          SPF="$(dig +short TXT broandbro.in @1.1.1.1 | grep -F 'v=spf1' | head -n 1 || true)"
          DMARC="$(dig +short TXT _dmarc.broandbro.in @1.1.1.1 | grep -F 'v=DMARC1' | head -n 1 || true)"
          echo "- MX: ${MX:-missing}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SPF: ${SPF:+present}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DMARC: ${DMARC:+present}" >> "$GITHUB_STEP_SUMMARY"
          echo "Do not retire old mail/DNS resources until DKIM and real mail send/receive are checked." >> "$GITHUB_STEP_SUMMARY"
