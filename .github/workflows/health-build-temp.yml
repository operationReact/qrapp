name: Temporary backend security compile regression
on:
  push:
    branches: [fix/brobro-public-health-and-cutover-check]
    paths: [.github/workflows/health-build-temp.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile backend and run unit tests
        run: gradle :backend:compileJava :backend:test --no-daemon
      - name: Validate Nginx staging script syntax
        run: bash -n scripts/prepare-prod-nginx-cutover.sh
