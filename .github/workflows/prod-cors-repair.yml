# Targeted migration repair: Terraform-owned CORS SSM parameter and backend environment.
# Exact allowlist, account guard, rollback-safe restart and public browser preflight.
name: Repair BroBro prod main-domain CORS and verify real browser preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-cors-repair.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: broandbro-prod-cors-repair
  cancel-in-progress: false

jobs:
  repair-cors:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Validate atomic CORS reload script syntax
        run: python3 -m py_compile scripts/apply-prod-cors-from-ssm.py

      - name: Assume Terraform role for one nonsecret production SSM parameter
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify account and update exact Terraform-owned CORS SSM value
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$EXPECTED_ACCOUNT" = "098859530205"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          NAME="/broandbro/backend/prod/app/cors/allowedOrigins"
          OLD="https://migrate-prod.broandbro.in"
          DESIRED="https://migrate-prod.broandbro.in,https://broandbro.in,https://www.broandbro.in"
          CURRENT="$(aws ssm get-parameter --name "$NAME" --query 'Parameter.Value' --output text)"
          if [[ "$CURRENT" == "$OLD" ]]; then
            aws ssm put-parameter --name "$NAME" --type String --overwrite \
              --value "$DESIRED" --query Version --output text >/dev/null
            echo "Updated only the approved nonsecret production CORS SSM parameter"
          elif [[ "$CURRENT" == "$DESIRED" ]]; then
            echo "Production CORS SSM already has exact approved value"
          else
            echo "::error::Unexpected existing CORS SSM configuration; refusing overwrite"
            exit 1
          fi
          VERIFIED="$(aws ssm get-parameter --name "$NAME" --query 'Parameter.Value' --output text)"
          test "$VERIFIED" = "$DESIRED" || { echo "::error::SSM value verification failed"; exit 1; }

      - name: Assume restricted backend role for SSM command
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Restart backend with atomic env rollback and local health verification
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]] || { echo "::error::Expected one running production EC2"; exit 1; }
          PAYLOAD="$(base64 -w0 scripts/apply-prod-cors-from-ssm.py)"
          COMMAND="echo '$PAYLOAD' | base64 -d >/tmp/broandbro-cors-repair.py && python3 /tmp/broandbro-cors-repair.py"
          python3 -c 'import json,sys;json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/cors-repair.json"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/cors-repair.json" \
            --timeout-seconds 900 \
            --comment "broandbro-prod-main-cors-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                echo "Backend restarted with approved CORS and recovered healthy"
                exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent}' --output json || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Backend CORS repair timed out"; exit 1

      - name: Verify genuine public CORS preflight for all three trusted origins
        run: |
          set -euo pipefail
          for ORIGIN in \
            https://migrate-prod.broandbro.in \
            https://broandbro.in \
            https://www.broandbro.in; do
            HEADERS="$(mktemp)"
            CODE="$(curl --noproxy '*' --silent --show-error --max-time 20 \
              -X OPTIONS -D "$HEADERS" -o /dev/null -w '%{http_code}' \
              -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' \
              https://api.broandbro.in/menu || true)"
            ALLOWED="$(grep -i '^access-control-allow-origin:' "$HEADERS" | tail -n 1 | tr -d '\r' | cut -d ':' -f 2- | xargs || true)"
            rm -f "$HEADERS"
            if [[ ! "$CODE" =~ ^2[0-9][0-9]$ || "$ALLOWED" != "$ORIGIN" ]]; then
              echo "::error::Origin CORS still blocked: $ORIGIN HTTP $CODE"
              exit 1
            fi
            echo "Origin $ORIGIN passed public CORS preflight"
          done
          echo "## Production CORS repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform-owned SSM setting corrected to main + www + preview origins" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend restart and local health: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public CORS preflight for three trusted origins: passed" >> "$GITHUB_STEP_SUMMARY"
