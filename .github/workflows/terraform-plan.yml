name: Terraform Plan - New Account PROD (Read Only)

# Single environment: PROD only. No plan or apply for DEV.
# Read-only plan is allowed on main: a change to THIS workflow only triggers
# one extra preflight. No changes to AWS resources, state, DNS or secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: broandbro-prod-terraform-plan
  cancel-in-progress: false

jobs:
  plan-prod:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Require exact PROD target
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          APP_REGION: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_BUCKET_REGION }}
        run: |
          set -euo pipefail
          test "$EXPECTED_ACCOUNT" = "098859530205" || exit 1
          test "$APP_REGION" = "ap-south-1" || exit 1
          test "$STATE_REGION" = "us-east-1" || exit 1
          test "$STATE_BUCKET" = "broandbro-tfstate-$EXPECTED_ACCOUNT-ap-south-1" || exit 1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: broandbro-prod-plan
      - name: Validate new AWS account and existing state bucket
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_BUCKET_REGION }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT" || exit 1
          LOCATION="$(aws s3api get-bucket-location --bucket "$STATE_BUCKET" \
            --expected-bucket-owner "$EXPECTED_ACCOUNT" --region "$STATE_REGION" \
            --query LocationConstraint --output text)"
          if [ "$LOCATION" = "None" ] || [ "$LOCATION" = "null" ]; then LOCATION=us-east-1; fi
          test "$LOCATION" = "$STATE_REGION" || exit 1
          test "$(aws s3api get-bucket-versioning --bucket "$STATE_BUCKET" \
            --expected-bucket-owner "$EXPECTED_ACCOUNT" --query Status --output text)" = "Enabled" || exit 1
      - name: Initialize exact NEW PROD backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_BUCKET_REGION: ${{ vars.TF_STATE_BUCKET_REGION }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=env/prod/terraform.tfstate" \
            -backend-config="region=$TF_STATE_BUCKET_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Confirm recovered state matches the failed-Apply manifest and no lock remains
        run: |
          python3 ../../../scripts/audit-prod-terraform-state.py
          python3 ../../../scripts/inspect-prod-s3-state-recovery.py
      - name: Check SSM readiness without exposing values (informational until provisioned)
        id: ssm
        continue-on-error: true
        run: python3 ../../../scripts/audit-prod-ssm.py
      - name: Validate and compute non-applying plan
        env:
          TF_VAR_expected_account_id: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          terraform validate -no-color
          terraform plan -input=false -lock=false -no-color
      - name: Explain approval gate
        run: |
          echo "## New-account PROD Terraform plan (NO APPLY)" >> "$GITHUB_STEP_SUMMARY"
          echo "Review proposed billable resources, replacement/destruction risks, DNS impact, and certificate readiness." >> "$GITHUB_STEP_SUMMARY"
          echo "The plan is not authorization to provision. Explicit owner approval required." >> "$GITHUB_STEP_SUMMARY"
          echo "SSM prerequisite check result: ${{ steps.ssm.outcome }} (see earlier log for exact missing parameter names; never values)." >> "$GITHUB_STEP_SUMMARY"
