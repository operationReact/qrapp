name: Terraform Plan - New Account (Read Only)

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Require target configuration
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$EXPECTED_ACCOUNT" && test -n "$STATE_BUCKET" || exit 1
          case "$EXPECTED_ACCOUNT" in *[!0-9]*|"") exit 1 ;; esac
          test "${#EXPECTED_ACCOUNT}" -eq 12
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Reject unexpected account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL" = "$EXPECTED_ACCOUNT" || { echo "::error::Old or wrong AWS account"; exit 1; }
      - name: Require an issued CloudFront certificate before DEV planning
        if: inputs.environment == 'dev'
        env:
          CERT_ARN: ${{ vars.DEV_ACM_CERTIFICATE_ARN }}
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$CERT_ARN" =~ ^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$ ]] || {
            echo "::error::DEV_ACM_CERTIFICATE_ARN not configured. Run Prepare CloudFront ACM Certificate first."; exit 1;
          }
          [[ "$CERT_ARN" == arn:aws:acm:us-east-1:"$EXPECTED_ACCOUNT":certificate/* ]] || exit 1
          [[ "$(aws acm describe-certificate --region us-east-1 --certificate-arn "$CERT_ARN" --query 'Certificate.Status' --output text)" == "ISSUED" ]] || {
            echo "::error::DNS validation still pending"; exit 1;
          }
          aws acm describe-certificate --region us-east-1 --certificate-arn "$CERT_ARN" \
            --query 'Certificate.SubjectAlternativeNames' --output json |
            jq -e 'index("migrate-dev.broandbro.in") != null' >/dev/null
      - name: Init NEW account state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=env/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Validate and plan with state locking
        env:
          TF_VAR_expected_account_id: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          TF_VAR_existing_certificate_arn: ${{ inputs.environment == 'dev' && vars.DEV_ACM_CERTIFICATE_ARN || '' }}
        run: |
          terraform validate
          terraform plan -input=false -no-color
