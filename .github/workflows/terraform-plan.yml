# =============================================================================
# Workflow: terraform-plan.yml
# Runs on pull requests to dev or main that touch infra/**
# Posts the plan output as a PR comment so reviewers can see what will change.
#
# Two separate jobs (dev + prod) instead of a matrix avoids the secret-scoping
# problem: each job declares its own GitHub Environment and therefore only
# has access to that environment's scoped secrets.
# =============================================================================
name: Terraform Plan

on:
  pull_request:
    branches: [dev, main]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write  # Needed to post PR comments

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "ap-south-1"

jobs:
  # ── Plan DEV ─────────────────────────────────────────────────────────────────
  plan-dev:
    name: Plan – dev
    runs-on: ubuntu-latest
    environment: dev  # Makes DEV_* environment secrets available

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=broandbro-tfstate-ap-south-1" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=broandbro-tf-lock"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
            -var="ec2_public_key=${{ secrets.DEV_EC2_PUBLIC_KEY }}"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComments = comments.filter(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan – `dev`')
            );
            for (const c of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id
              });
            }
            const icon = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const body = `### ${icon} Terraform Plan – \`dev\`
            <details><summary>Click to expand plan</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
            </details>

            *Triggered by @${{ github.actor }} · ${{ github.event_name }}*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Plan PROD ─────────────────────────────────────────────────────────────────
  plan-prod:
    name: Plan – prod
    runs-on: ubuntu-latest
    environment: prod  # Makes PROD_* environment secrets available

    defaults:
      run:
        working-directory: infra/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=broandbro-tfstate-ap-south-1" \
            -backend-config="key=env/prod/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=broandbro-tf-lock"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="db_password=${{ secrets.PROD_DB_PASSWORD }}" \
            -var="ec2_public_key=${{ secrets.PROD_EC2_PUBLIC_KEY }}"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComments = comments.filter(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan – `prod`')
            );
            for (const c of botComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id
              });
            }
            const icon = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const body = `### ${icon} Terraform Plan – \`prod\`
            <details><summary>Click to expand plan</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`
            </details>

            *Triggered by @${{ github.actor }} · ${{ github.event_name }}*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

