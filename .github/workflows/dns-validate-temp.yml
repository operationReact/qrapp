name: Temporary DNS Terraform validate
on:
  push:
    branches: [fix/route53-full-cutover-prep]
    paths: [.github/workflows/dns-validate-temp.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Verify DNS preparation is formatted
        run: terraform fmt -check -diff dns-cutover-preparation.tf
      - name: Initialize without AWS or remote state
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate -no-color
