# =============================================================================
# Workflow: backend-deploy-dev.yml
# Triggered by push to `dev` branch when backend/** changes.
# Builds Spring Boot JAR, SCPs it to DEV EC2, restarts the service.
# =============================================================================
name: Backend Deploy – Dev

on:
  push:
    branches: [dev]
    paths: ["backend/**"]

permissions:
  id-token: write
  contents: read

env:
  JAVA_VERSION: "21"
  AWS_REGION: "ap-south-1"

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build Spring Boot JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  # installs Gradle, handles caching

      - name: Build Spring Boot JAR
        # Run from repo root – settings.gradle includes 'backend' as a subproject
        run: gradle :backend:bootJar -x test --no-daemon --parallel

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-dev
          path: backend/build/libs/*.jar
          retention-days: 5

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Dev EC2
    runs-on: ubuntu-latest
    needs: build
    environment: dev

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar-dev
          path: ./jar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/broandbro_dev
          chmod 600 ~/.ssh/broandbro_dev
          ssh-keyscan -H ${{ secrets.DEV_EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write application.env to EC2
        run: |
          ssh -i ~/.ssh/broandbro_dev \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.DEV_EC2_HOST }} \
          "sudo mkdir -p /opt/broandbro/config
           {
             printf 'SPRING_PROFILES_ACTIVE=dev\n'
             printf 'SERVER_PORT=8080\n'
             printf 'SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.DEV_DB_HOST }}:5432/${{ secrets.DEV_DB_NAME }}\n'
             printf 'SPRING_DATASOURCE_USERNAME=${{ secrets.DEV_DB_USERNAME }}\n'
             printf 'SPRING_DATASOURCE_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}\n'
             printf 'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5\n'
           } | sudo tee /opt/broandbro/config/application.env > /dev/null
           sudo chown broandbro:broandbro /opt/broandbro/config/application.env
           sudo chmod 640 /opt/broandbro/config/application.env"

      - name: SCP JAR to EC2
        run: |
          JAR_FILE=$(ls jar/*.jar | head -1)
          echo "Deploying: $JAR_FILE"
          scp -i ~/.ssh/broandbro_dev \
              -o StrictHostKeyChecking=no \
              "$JAR_FILE" \
              ec2-user@${{ secrets.DEV_EC2_HOST }}:/tmp/app-new.jar

      - name: Deploy and restart service
        run: |
          ssh -i ~/.ssh/broandbro_dev \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.DEV_EC2_HOST }} \
          '
          set -e
          echo "--- Deploying new JAR ---"

          # Keep previous JAR as rollback backup
          [ -f /opt/broandbro/app.jar ] && \
            sudo cp /opt/broandbro/app.jar /opt/broandbro/app.jar.bak

          sudo mv /tmp/app-new.jar /opt/broandbro/app.jar
          sudo chown broandbro:broandbro /opt/broandbro/app.jar
          sudo chmod 640 /opt/broandbro/app.jar

          echo "--- Restarting broandbro service ---"
          sudo systemctl restart broandbro

          echo "--- Waiting for service to become healthy ---"
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(sudo systemctl is-active broandbro 2>/dev/null)
            echo "Attempt $i: service is $STATUS"
            if [ "$STATUS" = "active" ]; then
              echo "✅ Service started successfully"
              exit 0
            fi
          done

          echo "❌ Service failed to start after 2 minutes"
          sudo journalctl -u broandbro -n 50 --no-pager
          exit 1
          '

      - name: Deployment summary
        run: |
          echo "## ✅ Backend Deployed – Dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** https://dev-api.broandbro.in" >> $GITHUB_STEP_SUMMARY
          echo "- **EC2 Host:** ${{ secrets.DEV_EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
