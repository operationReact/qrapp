name: Backend Deploy-Dev

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/backend-deploy-dev.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write   # required for OIDC → AWS
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Dev EC2
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Set up Java 21 ────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "21"
          distribution: corretto


      # ── 3. Validate required secrets ─────────────────────────────────────────
      - name: Validate required secrets
        env:
          DEV_DB_USERNAME:       ${{ secrets.DEV_DB_USERNAME }}
          DEV_DB_PASSWORD:       ${{ secrets.DEV_DB_PASSWORD }}
          AWS_ROLE_ARN:          ${{ secrets.AWS_ROLE_ARN }}
          DEV_RAZORPAY_KEY:      ${{ secrets.DEV_RAZORPAY_KEY }}
          DEV_RAZORPAY_SECRET:   ${{ secrets.DEV_RAZORPAY_SECRET }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          MISSING=()
          [ -z "$DEV_DB_USERNAME" ]       && MISSING+=("DEV_DB_USERNAME")
          [ -z "$DEV_DB_PASSWORD" ]       && MISSING+=("DEV_DB_PASSWORD")
          [ -z "$AWS_ROLE_ARN" ]          && MISSING+=("AWS_ROLE_ARN")
          [ -z "$DEV_RAZORPAY_KEY" ]      && MISSING+=("DEV_RAZORPAY_KEY")
          [ -z "$DEV_RAZORPAY_SECRET" ]   && MISSING+=("DEV_RAZORPAY_SECRET")
          [ -z "$AWS_ACCESS_KEY_ID" ]     && MISSING+=("AWS_ACCESS_KEY_ID")
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && MISSING+=("AWS_SECRET_ACCESS_KEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required GitHub Secrets: ${MISSING[*]}"
            echo "   Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ All required secrets are present"

      # ── 4. Build JAR ─────────────────────────────────────────────────────────
      # Install Gradle 8.7 directly from the official distribution so we never
      # depend on a committed gradle-wrapper.jar (which is blocked by *.jar in
      # .gitignore and therefore always empty in this repo).
      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Spring Boot JAR
        run: gradle :backend:bootJar -x test --no-daemon

      # ── 5. Authenticate to AWS via OIDC ──────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # ── 6. Get EC2 instance ID from SSM ──────────────────────────────────────
      - name: Get EC2 instance ID
        id: ec2
        run: |
          IP=$(aws ssm get-parameter \
            --name "/broandbro/dev/ec2-public-ip" \
            --region ap-south-1 \
            --query "Parameter.Value" \
            --output text)
          echo "host=$IP" >> "$GITHUB_OUTPUT"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ap-south-1 \
            --filters "Name=ip-address,Values=$IP" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2 instance: $INSTANCE_ID ($IP)"

      # ── 7. Write application.env to SSM Parameter Store ──────────────────────
      # Secrets are expanded by GitHub Actions here (runner-side) and stored
      # as a SecureString. The EC2 deployment script reads this at deploy time.
      - name: Write application.env to SSM
        run: |
          aws ssm put-parameter \
            --region ap-south-1 \
            --name "/broandbro/dev/application-env" \
            --type "SecureString" \
            --overwrite \
            --value "SPRING_PROFILES_ACTIVE=dev
          SERVER_PORT=8080
          SPRING_DATASOURCE_URL=jdbc:postgresql://broandbro-dev.chi2yu0m6hp0.ap-south-1.rds.amazonaws.com:5432/broandbro_dev
          SPRING_DATASOURCE_USERNAME=${{ secrets.DEV_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL=gpt-image-1
          OPENAI_IMAGE_SIZE=1024x1024
          AWS_S3_BUCKET_NAME=broandbro-menu-images
          AWS_S3_REGION=ap-south-1
          AWS_S3_ENABLED=true
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAZORPAY_KEY=${{ secrets.DEV_RAZORPAY_KEY }}
          RAZORPAY_SECRET=${{ secrets.DEV_RAZORPAY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.DEV_RAZORPAY_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID=${{ secrets.DEV_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.DEV_TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER=${{ secrets.DEV_TWILIO_FROM_NUMBER }}
          TWILIO_ORDER_PLACED_CONTENT_SID=${{ secrets.DEV_TWILIO_ORDER_PLACED_CONTENT_SID }}
          TWILIO_OTP_CONTENT_SID=${{ secrets.DEV_TWILIO_OTP_CONTENT_SID }}"
          echo "✅ application.env written to SSM"

      # ── 8. Upload JAR to S3 (staging path) ───────────────────────────────────
      - name: Upload JAR to S3
        run: |
          aws s3 cp backend/build/libs/qrapp-*.jar \
            s3://broandbro-menu-images/deploy/app-new.jar \
            --region ap-south-1
          echo "✅ JAR uploaded to S3"

      # ── 9. Deploy & restart via SSM Run Command ───────────────────────────────
      # No SSH/port-22 required – uses the EC2 instance's IAM role via SSM Agent.
      - name: Deploy & restart via SSM
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          # Build deployment script as a JSON parameters file to avoid quoting issues
          python3 - << 'PYEOF'
          import json, subprocess, sys

          commands = [
              "set -euo pipefail",
              "echo '=== Backing up existing JAR ==='",
              "[ -f /opt/broandbro/app.jar ] && sudo cp /opt/broandbro/app.jar /opt/broandbro/app.jar.bak || true",
              "echo '=== Downloading new JAR from S3 ==='",
              "aws s3 cp s3://broandbro-menu-images/deploy/app-new.jar /tmp/app-new.jar --region ap-south-1",
              "sudo mv /tmp/app-new.jar /opt/broandbro/app.jar",
              "sudo chown broandbro:broandbro /opt/broandbro/app.jar",
              "echo '=== Writing application.env from SSM ==='",
              "aws ssm get-parameter --name /broandbro/dev/application-env --with-decryption --query Parameter.Value --output text --region ap-south-1 | sudo tee /opt/broandbro/config/application.env > /dev/null",
              "sudo chmod 640 /opt/broandbro/config/application.env",
              "sudo chown broandbro:broandbro /opt/broandbro/config/application.env",
              "echo '=== Restarting service ==='",
              "sudo systemctl daemon-reload",
              "sudo systemctl restart broandbro",
              "echo '=== Waiting for healthy startup ==='",
              "for i in $(seq 1 12); do sleep 5; STATUS=$(sudo systemctl is-active broandbro 2>/dev/null || echo inactive); echo \"[$i/12] Service: $STATUS\"; if [ \"$STATUS\" = \"active\" ]; then echo \"✅ broandbro started successfully\"; exit 0; fi; done; echo \"❌ Service failed to start\"; sudo journalctl -u broandbro -n 50 --no-pager; exit 1",
          ]

          with open("/tmp/ssm-params.json", "w") as f:
              json.dump({"commands": commands}, f)
          print("SSM params file written")
          PYEOF

          CMD_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 300 \
            --comment "Deploy from GitHub Actions ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $CMD_ID"
          echo "Polling for completion (max 5 min)..."

          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-south-1 \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/30] SSM command status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ap-south-1 \
                --query "StandardOutputContent" --output text
              exit 0
            elif [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut|Cancelling)$ ]]; then
              echo "❌ Deployment failed: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ap-south-1 \
                --query "StandardOutputContent" --output text
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ap-south-1 \
                --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          echo "❌ Timed out waiting for SSM command after 5 minutes"
          exit 1
