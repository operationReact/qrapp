name: Backend Deploy-Dev

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/backend-deploy-dev.yml"
      - "infra/modules/ec2/userdata.sh"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write   # required for OIDC → AWS
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Dev EC2
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Set up Java 21 ────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "21"
          distribution: corretto

      # ── 2b. Cache Gradle ─────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle/gradle-8.7
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-8.7-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.7-

      # ── 3. Validate AWS credentials (no app secrets needed - from SSM) ────────
      - name: Validate AWS role ARN is set
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "❌ Missing required GitHub Secret: AWS_ROLE_ARN"
            exit 1
          fi
          echo "✅ AWS_ROLE_ARN is configured"

      # ── 4. Build JAR ─────────────────────────────────────────────────────────
      - name: Install Gradle 8.7
        run: |
          if [ ! -f /opt/gradle/gradle-8.7/bin/gradle ]; then
            echo "⬇️ Cache miss – downloading Gradle 8.7..."
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
          else
            echo "✅ Gradle 8.7 restored from cache"
          fi
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Spring Boot JAR
        run: gradle :backend:bootJar -x test --no-daemon

      # ── 5. Authenticate to AWS via OIDC ──────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # ── 6. Resolve EC2 instance ID ───────────────────────────────────────────
      # SSM Run Command needs the instance ID, not the IP address.
      # We look it up from the tag set by Terraform.
      - name: Get EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=broandbro-dev-backend" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region us-east-1)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ No running EC2 instance found with tag Name=broandbro-dev-backend"
            exit 1
          fi
          echo "✅ Instance: $INSTANCE_ID"
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # ── 7. Fetch configuration from AWS Parameter Store ─────────────────────
      # All application configuration is stored in AWS Systems Manager
      # Parameter Store for security and consistency.
      - name: Fetch configuration from AWS Parameter Store
        run: |
          get_optional_parameter() {
            local parameter_name="$1"
            local parameter_value
            if parameter_value=$(aws ssm get-parameter \
              --name "$parameter_name" \
              --with-decryption \
              --query "Parameter.Value" --output text --region us-east-1 2>/dev/null); then
              printf '%s' "$parameter_value"
            else
              echo "::warning::Optional SSM parameter not found: $parameter_name" >&2
              printf ''
            fi
          }

          # Fetch database configuration
          DB_URL=$(aws ssm get-parameter \
            --name "/broandbro/backend/dev/database/url" \
            --query "Parameter.Value" --output text --region us-east-1)
          DB_USERNAME=$(aws ssm get-parameter \
            --name "/broandbro/backend/dev/database/username" \
            --query "Parameter.Value" --output text --region us-east-1)
          DB_PASSWORD=$(aws ssm get-parameter \
            --name "/broandbro/backend/dev/database/password" \
            --with-decryption \
            --query "Parameter.Value" --output text --region us-east-1)

          # Fetch service credentials
          OPENAI_API_KEY=$(get_optional_parameter "/broandbro/backend/dev/openai/apiKey")

          S3_BUCKET=$(get_optional_parameter "/broandbro/backend/dev/aws/s3/bucketName")
          S3_BUCKET=${S3_BUCKET:-broandbro-dev-root-bucket}
          S3_REGION=$(get_optional_parameter "/broandbro/backend/dev/aws/s3/region")
          S3_REGION=${S3_REGION:-us-east-1}
          S3_ENABLED=$(get_optional_parameter "/broandbro/backend/dev/aws/s3/enabled")
          S3_ENABLED=${S3_ENABLED:-true}

          RAZORPAY_KEY=$(get_optional_parameter "/broandbro/backend/dev/razorpay/key")
          RAZORPAY_SECRET=$(get_optional_parameter "/broandbro/backend/dev/razorpay/secret")
          RAZORPAY_WEBHOOK_SECRET=$(get_optional_parameter "/broandbro/backend/dev/razorpay/webhookSecret")

          TWILIO_ACCOUNT_SID=$(get_optional_parameter "/broandbro/backend/dev/twilio/accountSid")
          TWILIO_AUTH_TOKEN=$(get_optional_parameter "/broandbro/backend/dev/twilio/authToken")

          # Store in environment for next step
          echo "DB_URL=$DB_URL" >> $GITHUB_ENV
          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> $GITHUB_ENV
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
          echo "S3_REGION=$S3_REGION" >> $GITHUB_ENV
          echo "S3_ENABLED=$S3_ENABLED" >> $GITHUB_ENV
          echo "RAZORPAY_KEY=$RAZORPAY_KEY" >> $GITHUB_ENV
          echo "RAZORPAY_SECRET=$RAZORPAY_SECRET" >> $GITHUB_ENV
          echo "RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET" >> $GITHUB_ENV
          echo "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID" >> $GITHUB_ENV
          echo "TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN" >> $GITHUB_ENV
          echo "✅ Configuration fetched from AWS Parameter Store"

      # ── 8. Upload JAR + env file + deploy script to S3 ───────────────────────
      # All three files land in deploy/dev/<run_id>/ so cleanup is a single rm.
      # The env file is server-side encrypted (AES256); the EC2 IAM role already
      # has s3:GetObject on deploy/dev/* so no pre-signed URL is required.
      - name: Upload deploy artifacts to S3
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          S3_PREFIX="s3://broandbro-dev-root-bucket/deploy/dev/${RUN_ID}"

          # ── a) JAR ──────────────────────────────────────────────────────────
          echo "📦 Uploading JAR..."
          aws s3 cp backend/build/libs/qrapp-*.jar \
            "${S3_PREFIX}/app.jar" --region us-east-1
          echo "✅ JAR uploaded"

          # ── b) application.env (written on the runner, uploaded encrypted) ──
          # Configuration fetched from AWS Parameter Store
          cat > /tmp/application.env << EOF
          SPRING_PROFILES_ACTIVE=dev
          SERVER_PORT=8080

          SPRING_DATASOURCE_URL=${DB_URL}
          SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
          SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

          OPENAI_API_KEY=${OPENAI_API_KEY}
          OPENAI_IMAGE_MODEL=gpt-image-1
          OPENAI_IMAGE_SIZE=1024x1024

          AWS_S3_BUCKET_NAME=${S3_BUCKET}
          AWS_S3_REGION=${S3_REGION}
          AWS_S3_ENABLED=${S3_ENABLED}

          RAZORPAY_KEY=${RAZORPAY_KEY}
          RAZORPAY_SECRET=${RAZORPAY_SECRET}
          RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}

          TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
          TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
          TWILIO_FROM_NUMBER=+918879998899
          TWILIO_ORDER_PLACED_CONTENT_SID=HXb23bcb8f1d5f7c8b9e0a1c2d3e4f5a
          TWILIO_OTP_CONTENT_SID=HXb23bcb8f1d5f7c8b9e0a1c2d3e4f5a
          EOF
          aws s3 cp /tmp/application.env \
            "${S3_PREFIX}/application.env" \
            --region us-east-1 --sse AES256
          echo "✅ Env file uploaded"

          # ── c) deploy.sh – runs ON the EC2, contains no secrets ─────────────
          # RUN_ID is substituted here on the runner before upload.
          cat > /tmp/deploy.sh << SCRIPT
          #!/bin/bash
          set -euo pipefail
          RID="${RUN_ID}"
          S3="s3://broandbro-dev-root-bucket/deploy/dev/\${RID}"

          echo "⬇️  Downloading JAR..."
          aws s3 cp "\${S3}/app.jar" /tmp/app-new.jar --region us-east-1

          [ -f /opt/broandbro/app.jar ] && \
            cp /opt/broandbro/app.jar /opt/broandbro/app.jar.bak || true
          mv /tmp/app-new.jar /opt/broandbro/app.jar
          chown broandbro:broandbro /opt/broandbro/app.jar

          echo "⬇️  Downloading env config..."
          aws s3 cp "\${S3}/application.env" \
            /opt/broandbro/config/application.env --region us-east-1
          chmod 640 /opt/broandbro/config/application.env
          chown broandbro:broandbro /opt/broandbro/config/application.env

          echo "🔄  Restarting service..."
          systemctl daemon-reload
          systemctl restart broandbro

          echo "🔒  Ensuring HTTPS is configured..."
          if [ ! -d /etc/letsencrypt/live/dev-api.broandbro.in ]; then
            certbot --nginx \
              -d dev-api.broandbro.in \
              --email admin@broandbro.in \
              --agree-tos \
              --no-eff-email \
              --non-interactive \
              --redirect
          else
            certbot renew --quiet
          fi
          nginx -t
          systemctl reload nginx
          ss -ltn '( sport = :443 )' | grep -q LISTEN
          echo "✅  HTTPS is listening on port 443"

          echo "⏳  Waiting for healthy startup..."
          for i in \$(seq 1 12); do
            sleep 5
            STATUS=\$(systemctl is-active broandbro 2>/dev/null || echo inactive)
            echo "  [\${i}/12] \${STATUS}"
            if [ "\${STATUS}" = "active" ]; then
              echo "✅  broandbro is running"
              exit 0
            fi
          done
          echo "❌  Service failed to start"
          journalctl -u broandbro -n 50 --no-pager
          exit 1
          SCRIPT

          aws s3 cp /tmp/deploy.sh \
            "${S3_PREFIX}/deploy.sh" --region us-east-1
          echo "✅ Deploy script uploaded"

      # ── 9. Ensure SSM agent is online before deploying ───────────────────────
      # If the instance rebooted or the SSM agent crashed, all Run Commands will
      # stay "Delayed" until the agent reconnects.  We check ping status and,
      # if offline, reboot the instance and wait up to 4 minutes for recovery.
      - name: Ensure SSM agent is online
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.id }}
        run: |
          check_ping() {
            aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text --region us-east-1 2>/dev/null || echo "None"
          }

          PING=$(check_ping)
          echo "SSM agent ping: $PING"

          if [ "$PING" = "Online" ]; then
            echo "✅ SSM agent is online – no recovery needed"
            exit 0
          fi

          echo "⚠️  SSM agent is '$PING'. Rebooting instance to recover SSM agent..."
          aws ec2 reboot-instances --instance-ids "$INSTANCE_ID" --region us-east-1
          echo "   Reboot requested. Waiting 45s for shutdown..."
          sleep 45

          echo "⏳ Polling for SSM agent to come back online (up to 5 min)..."
          for i in $(seq 1 30); do
            sleep 10
            PING=$(check_ping)
            echo "  [$i/30] $PING"
            if [ "$PING" = "Online" ]; then
              echo "✅ SSM agent is back online"
              exit 0
            fi
          done
          echo "❌ SSM agent did not come online after reboot"
          exit 1

      # ── 10. Execute deploy via SSM Run Command (no SSH / no port 22) ──────────
      # The EC2 already has AmazonSSMManagedInstanceCore + S3 deploy/* access
      # attached via Terraform. SSM pulls and runs deploy.sh from S3 as root.
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.id }}
          RUN_ID:      ${{ github.run_id }}
        run: |
          S3_SCRIPT="s3://broandbro-dev-root-bucket/deploy/dev/${RUN_ID}/deploy.sh"
          CMD="aws s3 cp ${S3_SCRIPT} /tmp/deploy_${RUN_ID}.sh --region us-east-1 \
            && bash /tmp/deploy_${RUN_ID}.sh \
            ; rm -f /tmp/deploy_${RUN_ID}.sh"

          echo "🚀 Sending SSM command to ${INSTANCE_ID}..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy-${RUN_ID}" \
            --parameters "commands=[\"${CMD}\"]" \
            --timeout-seconds 900 \
            --region us-east-1 \
            --output text \
            --query 'Command.CommandId')

          echo "SSM Command ID: ${COMMAND_ID}"

          # Poll until terminal status (Success / Failed / TimedOut / Cancelled)
          echo "⏳ Polling SSM command..."
          for i in $(seq 1 90); do
            sleep 10
            INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region us-east-1 2>/dev/null || echo '{"StatusDetails":"Pending"}')

            STATUS=$(echo "$INVOCATION" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('StatusDetails','Pending'))")

            echo "  [${i}/60] ${STATUS}"

            case "$STATUS" in
              Success)
                OUTPUT=$(echo "$INVOCATION" | python3 -c \
                  "import sys,json; print(json.load(sys.stdin).get('StandardOutputContent',''))")
                echo "=== Remote output ==="
                echo "$OUTPUT"
                echo "✅ Deployment successful"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                OUTPUT=$(echo "$INVOCATION" | python3 -c \
                  "import sys,json; d=json.load(sys.stdin); \
                   print(d.get('StandardOutputContent','')); \
                   print(d.get('StandardErrorContent',''))")
                echo "=== Remote output / errors ==="
                echo "$OUTPUT"
                echo "❌ Deploy failed with SSM status: ${STATUS}"
                exit 1
                ;;
            esac
          done
          echo "❌ Timed out waiting for SSM command after 15 minutes"
          exit 1

      # ── 11. Cleanup S3 artifacts ───────────────────────────────────────────────
      - name: Cleanup S3 deploy artifacts
        if: always()
        run: |
          aws s3 rm \
            s3://broandbro-dev-root-bucket/deploy/dev/${{ github.run_id }}/ \
            --recursive || true
