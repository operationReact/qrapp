name: Backend Deploy-Dev

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/backend-deploy-dev.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write   # required for OIDC → AWS
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Dev EC2
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Set up Java 21 ────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "21"
          distribution: corretto


      # ── 3. Validate required secrets ─────────────────────────────────────────
      - name: Validate required secrets
        env:
          DEV_DB_USERNAME:       ${{ secrets.DEV_DB_USERNAME }}
          DEV_DB_PASSWORD:       ${{ secrets.DEV_DB_PASSWORD }}
          AWS_ROLE_ARN:          ${{ secrets.AWS_ROLE_ARN }}
          DEV_RAZORPAY_KEY:      ${{ secrets.DEV_RAZORPAY_KEY }}
          DEV_RAZORPAY_SECRET:   ${{ secrets.DEV_RAZORPAY_SECRET }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          MISSING=()
          [ -z "$DEV_DB_USERNAME" ]       && MISSING+=("DEV_DB_USERNAME")
          [ -z "$DEV_DB_PASSWORD" ]       && MISSING+=("DEV_DB_PASSWORD")
          [ -z "$AWS_ROLE_ARN" ]          && MISSING+=("AWS_ROLE_ARN")
          [ -z "$DEV_RAZORPAY_KEY" ]      && MISSING+=("DEV_RAZORPAY_KEY")
          [ -z "$DEV_RAZORPAY_SECRET" ]   && MISSING+=("DEV_RAZORPAY_SECRET")
          [ -z "$AWS_ACCESS_KEY_ID" ]     && MISSING+=("AWS_ACCESS_KEY_ID")
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && MISSING+=("AWS_SECRET_ACCESS_KEY")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required GitHub Secrets: ${MISSING[*]}"
            echo "   Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ All required secrets are present"

      # ── 4. Build JAR ─────────────────────────────────────────────────────────
      # Install Gradle 8.7 directly from the official distribution so we never
      # depend on a committed gradle-wrapper.jar (which is blocked by *.jar in
      # .gitignore and therefore always empty in this repo).
      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Spring Boot JAR
        run: gradle :backend:bootJar -x test --no-daemon

      # ── 5. Authenticate to AWS via OIDC ──────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # ── 6. Get EC2 instance ID from SSM ──────────────────────────────────────
      - name: Get EC2 instance ID
        id: ec2
        run: |
          IP=$(aws ssm get-parameter \
            --name "/broandbro/dev/ec2-public-ip" \
            --region ap-south-1 \
            --query "Parameter.Value" \
            --output text)
          echo "host=$IP" >> "$GITHUB_OUTPUT"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ap-south-1 \
            --filters "Name=ip-address,Values=$IP" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2 instance: $INSTANCE_ID ($IP)"

      # ── 7. Write application.env to SSM Parameter Store ──────────────────────
      # Secrets are expanded by GitHub Actions here (runner-side) and stored
      # as a SecureString. The EC2 deployment script reads this at deploy time.
      - name: Write application.env to SSM
        run: |
          aws ssm put-parameter \
            --region ap-south-1 \
            --name "/broandbro/dev/application-env" \
            --type "SecureString" \
            --overwrite \
            --value "SPRING_PROFILES_ACTIVE=dev
          SERVER_PORT=8080
          SPRING_DATASOURCE_URL=jdbc:postgresql://broandbro-dev.chi2yu0m6hp0.ap-south-1.rds.amazonaws.com:5432/broandbro_dev
          SPRING_DATASOURCE_USERNAME=${{ secrets.DEV_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL=gpt-image-1
          OPENAI_IMAGE_SIZE=1024x1024
          AWS_S3_BUCKET_NAME=broandbro-menu-images
          AWS_S3_REGION=ap-south-1
          AWS_S3_ENABLED=true
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAZORPAY_KEY=${{ secrets.DEV_RAZORPAY_KEY }}
          RAZORPAY_SECRET=${{ secrets.DEV_RAZORPAY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.DEV_RAZORPAY_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID=${{ secrets.DEV_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.DEV_TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER=${{ secrets.DEV_TWILIO_FROM_NUMBER }}
          TWILIO_ORDER_PLACED_CONTENT_SID=${{ secrets.DEV_TWILIO_ORDER_PLACED_CONTENT_SID }}
          TWILIO_OTP_CONTENT_SID=${{ secrets.DEV_TWILIO_OTP_CONTENT_SID }}"
          echo "✅ application.env written to SSM"

      # ── 8. Upload JAR to S3 (staging path) ───────────────────────────────────
      - name: Upload JAR to S3
        run: |
          aws s3 cp backend/build/libs/qrapp-*.jar \
            s3://broandbro-menu-images/deploy/app-new.jar \
            --region ap-south-1
          echo "✅ JAR uploaded to S3"

      # ── 9. Verify SSM connectivity then deploy ────────────────────────────────
      - name: Deploy & restart via SSM
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          echo "Checking SSM connectivity for $INSTANCE_ID..."
          SSM_STATUS=$(aws ssm describe-instance-information \
            --region ap-south-1 \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text 2>/dev/null || echo "None")
          echo "SSM agent PingStatus: $SSM_STATUS"
          if [ "$SSM_STATUS" != "Online" ]; then
            echo "SSM agent is not Online (got: $SSM_STATUS). Cannot deploy."
            echo "Check: AWS Console -> Systems Manager -> Fleet Manager -> $INSTANCE_ID"
            exit 1
          fi

          python3 - << 'PYEOF'
          import json, base64
          lines = [
              "#!/bin/bash",
              "set -e",
              "echo '=== [1/6] Backing up existing JAR ==='",
              "[ -f /opt/broandbro/app.jar ] && cp /opt/broandbro/app.jar /opt/broandbro/app.jar.bak || true",
              "echo '=== [2/6] Downloading new JAR from S3 ==='",
              "aws s3 cp s3://broandbro-menu-images/deploy/app-new.jar /tmp/app-new.jar --region ap-south-1",
              "mv /tmp/app-new.jar /opt/broandbro/app.jar",
              "chown broandbro:broandbro /opt/broandbro/app.jar",
              "echo '=== [3/6] Writing application.env from SSM ==='",
              "aws ssm get-parameter --name /broandbro/dev/application-env --with-decryption --query Parameter.Value --output text --region ap-south-1 > /opt/broandbro/config/application.env",
              "chmod 640 /opt/broandbro/config/application.env",
              "chown broandbro:broandbro /opt/broandbro/config/application.env",
              "echo '=== [4/6] Restarting service ==='",
              "systemctl daemon-reload",
              "systemctl stop broandbro 2>/dev/null || true",
              "sleep 2",
              "systemctl start broandbro",
              "echo '=== [5/6] Waiting for healthy startup ==='",
              "for i in $(seq 1 24); do sleep 10; S=$(systemctl is-active broandbro 2>/dev/null || echo inactive); echo \"  [$i/24] $S\"; if [ \"$S\" = \"active\" ]; then echo 'Service started OK'; systemctl status broandbro --no-pager -l; exit 0; fi; done; echo 'SERVICE FAILED TO START'; journalctl -u broandbro -n 150 --no-pager; exit 1",
          ]
          script = "\n".join(lines)
          b64 = base64.b64encode(script.encode()).decode()
          params = {
              "commands": [
                  "echo '" + b64 + "' | base64 -d > /tmp/deploy.sh",
                  "chmod +x /tmp/deploy.sh",
                  "sudo bash /tmp/deploy.sh 2>&1",
              ]
          }
          with open("/tmp/ssm-params.json", "w") as f:
              json.dump(params, f)
          print("SSM params written OK")
          PYEOF

          CMD_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 60 \
            --comment "Deploy ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 15
            INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-south-1 \
              --output json 2>/dev/null || echo '{"Status":"Pending","StatusDetails":"Waiting"}')
            STATUS=$(echo "$INVOCATION" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('Status','Pending'))")
            DETAILS=$(echo "$INVOCATION" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('StatusDetails',''))")
            echo "[$i/60] $STATUS ($DETAILS)"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region ap-south-1 --query "StandardOutputContent" --output text
              exit 0
            elif [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut|Cancelling)$ ]]; then
              echo "Deployment failed: $STATUS - $DETAILS"
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region ap-south-1 --query "StandardOutputContent" --output text
              echo "--- STDERR ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region ap-south-1 --query "StandardErrorContent" --output text
              exit 1
            fi
          done
          echo "Timed out after 15 minutes"
          exit 1
