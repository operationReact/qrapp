# =============================================================================
# Workflow: backend-deploy-dev.yml
# Triggered by push to `dev` branch when backend/** changes.
# Builds Spring Boot JAR, SCPs it to DEV EC2, restarts the service.
# =============================================================================
name: Backend Deploy – Dev

on:
  push:
    branches: [dev]
    paths: ["backend/**"]

permissions:
  id-token: write
  contents: read

env:
  JAVA_VERSION: "21"
  AWS_REGION: "ap-south-1"

jobs:
  build:
    name: Build Spring Boot JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto
          cache: gradle

      - name: Build Spring Boot JAR
        run: |
          chmod +x ./gradlew
          ./gradlew :backend:bootJar -x test --no-daemon --parallel

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-dev
          path: backend/build/libs/*.jar
          retention-days: 5