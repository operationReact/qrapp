# Non-destructive main-domain TLS activation. Never changes DNS, registrar delegation, or email records.
name: Verify main BroBro DNS and activate HTTPS on NEW account only when safe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-main-domain-https.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: broandbro-prod-main-domain-https
  cancel-in-progress: false

jobs:
  activate-main-https:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Validate safe TLS activation shell script
        run: bash -n scripts/activate-prod-main-https.sh

      - name: Assume production backend role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify exact new account and target instance
        id: target
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$EXPECTED_ACCOUNT" = "098859530205"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]] || { echo "::error::Expected exactly one production EC2"; exit 1; }
          IP="$(aws ec2 describe-instances --instance-ids "$INSTANCE" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)"
          [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Missing new account EC2 public IP"; exit 1; }
          echo "instance=$INSTANCE" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Gate certificate issuance on all three public main A records
        id: public_dns
        env:
          IP: ${{ steps.target.outputs.ip }}
        run: |
          set -euo pipefail
          READY=true
          echo "## Public main-domain DNS vs new EC2" >> "$GITHUB_STEP_SUMMARY"
          for HOST in broandbro.in www.broandbro.in api.broandbro.in; do
            A1="$(dig +short A "$HOST" @1.1.1.1 | sort -u || true)"
            A2="$(dig +short A "$HOST" @8.8.8.8 | sort -u || true)"
            if [[ "$A1" == "$IP" && "$A2" == "$IP" ]]; then
              echo "- $HOST: new EC2" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $HOST: NOT consistently pointing to new EC2" >> "$GITHUB_STEP_SUMMARY"
              READY=false
            fi
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [[ "$READY" != "true" ]]; then
            echo "::warning::Main domains not fully pointed at new EC2. No TLS or DNS changes will be made."
          fi

      - name: Activate main website and API TLS via SSM (only once DNS matches)
        if: steps.public_dns.outputs.ready == 'true'
        env:
          INSTANCE: ${{ steps.target.outputs.instance }}
        run: |
          set -euo pipefail
          PAYLOAD="$(base64 -w0 scripts/activate-prod-main-https.sh)"
          COMMAND="echo '$PAYLOAD' | base64 -d >/tmp/broandbro-main-https.sh && bash /tmp/broandbro-main-https.sh"
          python3 -c 'import json,sys;json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/main-https-ssm.json"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/main-https-ssm.json" \
            --timeout-seconds 900 \
            --comment "broandbro-prod-main-tls-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                echo "Main host TLS activated on new EC2"
                exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent,Output:StandardOutputContent}' --output json || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Main host TLS SSM timed out"; exit 1

      - name: Verify public website and API HTTPS
        if: steps.public_dns.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for HOST in broandbro.in www.broandbro.in; do
            curl --noproxy '*' --fail --silent --show-error --max-time 20 "https://$HOST/" >/dev/null
            echo "Public $HOST HTTPS verified"
          done
          curl --noproxy '*' --fail --silent --show-error --max-time 20 \
            https://api.broandbro.in/actuator/health >/dev/null
          echo "Public api.broandbro.in HTTPS health verified"

      - name: Report readiness without claiming unverified cutover
        run: |
          echo "## Main website and API HTTPS readiness" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.public_dns.outputs.ready }}" == "true" ]]; then
            echo "- Public HTTPS of broandbro.in, www, and api: verified" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Not yet cut over to new EC2 on every main hostname; TLS not attempted" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- This workflow does not change registrar NS, DNS, MX, SPF, DKIM or DMARC." >> "$GITHUB_STEP_SUMMARY"
