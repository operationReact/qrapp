name: One-time verify new EC2 main vhosts after health fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/nginx-cutover-verify-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prod-nginx-cutover-prep.yml --repo "$GITHUB_REPOSITORY" --ref main
