# =============================================================================
# Workflow: frontend-deploy-prod.yml
# Triggered by push to `main` branch when frontend/** changes.
# Builds the Vite app and deploys to the PROD S3 bucket + CloudFront.
# Requires manual approval via the "prod" GitHub Environment.
# =============================================================================
name: Frontend Deploy – Prod

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "20"
  AWS_REGION: "ap-south-1"
  S3_BUCKET: "broandbro-prod-ui"
  # NOTE: CF_DISTRIBUTION_ID cannot be set here from secrets – referenced directly in the step below
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-frontend-prod:
    name: Build & Deploy Frontend – Prod
    runs-on: ubuntu-latest
    environment: prod  # ← Requires manual approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "https://api.broandbro.in"
          VITE_ENV: "prod"
          NODE_ENV: "production"

      - name: Verify API URL was baked in
        working-directory: frontend
        run: |
          echo "Checking that VITE_API_URL was baked into the bundle..."
          grep -r "\"https://api.broandbro.in\"" dist/ --include="*.js" -l && echo "✅ api.broandbro.in found in bundle" || echo "❌ WARNING: api.broandbro.in NOT found in bundle!"
          grep -r "dev-api.broandbro.in" dist/ --include="*.js" -l && echo "❌ WARNING: dev URL present in prod bundle!" || echo "✅ Dev URL not in prod bundle"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload remaining files (short cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=3600" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "## ✅ Frontend Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://broandbro.in" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket:** ${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** ${{ secrets.PROD_CF_DISTRIBUTION_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

