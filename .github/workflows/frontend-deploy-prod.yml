# =============================================================================
# Workflow: frontend-deploy-prod.yml
# Triggered by push to `main` branch when frontend/** changes.
# Builds the Vite app and deploys to the PROD S3 bucket + CloudFront.
# Requires manual approval via the "prod" GitHub Environment.
# =============================================================================
name: Frontend Deploy-Prod

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy-prod.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "broandbro-prod-ui"
  # NOTE: CloudFront distribution ID is read from SSM during deploy steps.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-frontend-prod:
    name: Build & Deploy Frontend – Prod
    runs-on: ubuntu-latest
    environment: prod  # ← Requires manual approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          # Try the strict, reproducible install first. If the lockfile is out of sync
          # `npm ci` will fail; fall back to `npm install` as a temporary CI workaround.
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed — falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Build Vite app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "https://api.broandbro.in"
          VITE_ENV: "prod"
          NODE_ENV: "production"

      - name: Verify API URL was baked in
        working-directory: frontend
        run: |
          echo "Checking that VITE_API_URL was baked into the bundle..."
          grep -r "\"https://api.broandbro.in\"" dist/ --include="*.js" -l && echo "✅ api.broandbro.in found in bundle" || echo "❌ WARNING: api.broandbro.in NOT found in bundle!"
          grep -r "dev-api.broandbro.in" dist/ --include="*.js" -l && echo "❌ WARNING: dev URL present in prod bundle!" || echo "✅ Dev URL not in prod bundle"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFront distribution ID
        run: |
          CF_DIST_ID=$(aws ssm get-parameter \
            --name "/broandbro/prod/cf-distribution-id" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          if [ -z "$CF_DIST_ID" ] || [ "$CF_DIST_ID" = "None" ]; then
            echo "❌ Missing or empty SSM parameter: /broandbro/prod/cf-distribution-id"
            exit 1
          fi
          echo "CF_DIST_ID=$CF_DIST_ID" >> "$GITHUB_ENV"

      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload remaining files (short cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=3600" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --delete

      - name: Upload PWA and app-link files
        run: |
          aws s3 cp frontend/dist/manifest.webmanifest s3://${{ env.S3_BUCKET }}/manifest.webmanifest \
            --content-type "application/manifest+json" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/sw.js s3://${{ env.S3_BUCKET }}/sw.js \
            --content-type "application/javascript" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/favicon.svg s3://${{ env.S3_BUCKET }}/favicon.svg \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/offline.html s3://${{ env.S3_BUCKET }}/offline.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/apple-touch-icon.png s3://${{ env.S3_BUCKET }}/apple-touch-icon.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-192.png s3://${{ env.S3_BUCKET }}/pwa-192.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-512.png s3://${{ env.S3_BUCKET }}/pwa-512.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-maskable-512.png s3://${{ env.S3_BUCKET }}/pwa-maskable-512.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/.well-known/assetlinks.json s3://${{ env.S3_BUCKET }}/.well-known/assetlinks.json \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"

      - name: Deployment summary
        run: |
          echo "## ✅ Frontend Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://broandbro.in" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket:** ${{ env.S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront:** $CF_DIST_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
