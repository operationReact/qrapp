# =============================================================================
# Workflow: frontend-deploy-prod.yml
# Triggered by push to `main` branch when frontend/** changes.
# Builds Vite, stores artifacts in private S3 and serves them via EC2/Nginx.
# Requires manual approval via the "prod" GitHub Environment.
# =============================================================================
name: Frontend Deploy-Prod

on:
  # Approved auth UI changes are published to the already verified new-account EC2.
  # The prod environment gate and AWS account checks remain mandatory.
  push:
    branches: [main]
    paths:
      - "frontend/src/routes/(auth)/login.jsx"
      - "frontend/src/routes/(auth)/register.jsx"
      - "frontend/src/styles/auth-login.css"
      - ".github/workflows/frontend-deploy-prod.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: "ap-south-1"
  S3_BUCKET: "broandbro-prod-ui-${{ vars.AWS_NEW_ACCOUNT_ID }}"
  # NOTE: CloudFront distribution ID is read from SSM during deploy steps.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-frontend-prod:
    if: github.ref == 'refs/heads/main'
    name: Build & Deploy Frontend – Prod
    runs-on: ubuntu-latest
    environment: prod  # ← Requires manual approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate new-account preview API URL before building
        env:
          API_URL: ${{ vars.API_URL }}
          ACCOUNT_ID: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo "::error::New AWS account is not configured"; exit 1; }
          if [[ "$API_URL" != "https://migrate-prod-api.broandbro.in" ]]; then
            echo "::error::Expected the new-account prod preview API URL; refusing build"
            exit 1
          fi

      - name: Install locked dependencies (reproducible)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Vite app
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_ENV: "prod"
          NODE_ENV: "production"

      - name: Verify built bundle API target (fail closed)
        working-directory: frontend
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          if ! grep -FRq -- "$API_URL" dist/assets; then
            echo "::error::Expected API_URL missing from frontend bundle; aborting deployment"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Require new account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          test -n "$EXPECTED_ACCOUNT" || { echo "::error::AWS_NEW_ACCOUNT_ID not configured"; exit 1; }
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL" = "$EXPECTED_ACCOUNT" || { echo "::error::Wrong AWS account"; exit 1; }

      - name: Upload hashed assets (long cache)
        run: |
          aws s3 sync frontend/dist/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload remaining files (short cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=3600" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --delete

      - name: Upload PWA and app-link files
        run: |
          aws s3 cp frontend/dist/manifest.webmanifest s3://${{ env.S3_BUCKET }}/manifest.webmanifest \
            --content-type "application/manifest+json" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/sw.js s3://${{ env.S3_BUCKET }}/sw.js \
            --content-type "application/javascript" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/favicon.svg s3://${{ env.S3_BUCKET }}/favicon.svg \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/offline.html s3://${{ env.S3_BUCKET }}/offline.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp frontend/dist/apple-touch-icon.png s3://${{ env.S3_BUCKET }}/apple-touch-icon.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-192.png s3://${{ env.S3_BUCKET }}/pwa-192.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-512.png s3://${{ env.S3_BUCKET }}/pwa-512.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/pwa-maskable-512.png s3://${{ env.S3_BUCKET }}/pwa-maskable-512.png \
            --content-type "image/png" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/.well-known/assetlinks.json s3://${{ env.S3_BUCKET }}/.well-known/assetlinks.json \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

      # The backend OIDC role has tightly scoped SSM SendCommand rights for the prod EC2.
      - name: Assume production backend deploy role for SSM
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish private S3 build to Nginx over SSM (local HTTP staging)
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || { echo "::error::Expected one running production EC2"; exit 1; }
          EXPECTED_HASH="$(sha256sum frontend/dist/index.html | cut -d ' ' -f1)"
          # Do not rely on sync's timestamp/size heuristics for the mutable HTML entry point.
          # Fetch it unconditionally, verify its bytes, then replace it atomically.
          COMMAND="$(cat <<'REMOTE'
          set -euo pipefail
          root=/var/www/broandbro
          mkdir -p "$root"
          tmp="$(mktemp "$root/.release-index.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          aws s3 sync "s3://BUCKET_PLACEHOLDER/" "$root/" --exclude index.html --exclude '.release-index.*' --only-show-errors
          aws s3 cp "s3://BUCKET_PLACEHOLDER/index.html" "$tmp" --only-show-errors
          printf '%s  %s\n' HASH_PLACEHOLDER "$tmp" | sha256sum -c -
          chmod 644 "$tmp"
          mv -f "$tmp" "$root/index.html"
          chmod -R a+rX "$root"
          sha256sum "$root/index.html"
          nginx -t
          systemctl reload nginx
          REMOTE
          )"
          COMMAND="${COMMAND//BUCKET_PLACEHOLDER/$S3_BUCKET}"
          COMMAND="${COMMAND//HASH_PLACEHOLDER/$EXPECTED_HASH}"
          python3 -c 'import json,sys; json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/frontend-ssm.json"
          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/frontend-ssm.json" \
            --timeout-seconds 900 \
            --comment "broandbro-prod-frontend-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "Exact frontend index published atomically to EC2"
                exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent}' --output json || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Frontend SSM deploy timed out"; exit 1

      # Public preview DNS is still delegated to the older hosted zone in this migration.
      # Certificate issuance must never prevent staging a verified new-account build.
      - name: Check public preview DNS before attempting TLS
        id: preview_dns
        run: |
          set -euo pipefail
          # The backend deploy role can DescribeInstances but cannot read the EC2 IP SSM parameter.
          EXPECTED_IP="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].PublicIpAddress' --output text)"
          [[ "$EXPECTED_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected one production EC2 public IP"; exit 1; }
          DNS_CF="$(dig +short A migrate-prod.broandbro.in @1.1.1.1 | sort -u || true)"
          DNS_GOOGLE="$(dig +short A migrate-prod.broandbro.in @8.8.8.8 | sort -u || true)"
          if [[ "$DNS_CF" == "$EXPECTED_IP" && "$DNS_GOOGLE" == "$EXPECTED_IP" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Preview hostname resolves to the new EC2 from two public resolvers."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Frontend assets are staged. Preview HTTPS deferred until public DNS points to the new EC2."
          fi

      - name: Issue HTTPS certificate and smoke-test preview (only with correct public DNS)
        if: steps.preview_dns.outputs.ready == 'true'
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || { echo "::error::Expected one running EC2 instance"; exit 1; }
          COMMAND="set -euo pipefail; certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d migrate-prod.broandbro.in --redirect; nginx -t; curl -fsS --max-time 15 --resolve migrate-prod.broandbro.in:443:127.0.0.1 https://migrate-prod.broandbro.in/ >/dev/null"
          python3 -c 'import json,sys; json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/frontend-tls-ssm.json"
          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/frontend-tls-ssm.json" \
            --timeout-seconds 900 \
            --comment "broandbro-prod-frontend-tls-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                curl -fsS --max-time 15 https://migrate-prod.broandbro.in/ >/dev/null
                echo "Preview HTTPS smoke check passed"
                exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent}' --output json || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Preview TLS SSM deployment timed out"; exit 1

      - name: Diagnose origin versus public release (DNS and response checksums)
        shell: bash
        run: |
          set -euo pipefail
          IP="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].PublicIpAddress' --output text)"
          [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          expected="$(sha256sum frontend/dist/index.html | cut -d ' ' -f1)"
          echo "EC2 target: $IP; expected index: $expected"
          for host in broandbro.in www.broandbro.in migrate-prod.broandbro.in; do
            echo "$host public A (Cloudflare): $(dig +short A "$host" @1.1.1.1 | paste -sd, -)"
            echo "$host public A (Google): $(dig +short A "$host" @8.8.8.8 | paste -sd, -)"
            echo "$host public AAAA: $(dig +short AAAA "$host" @1.1.1.1 | paste -sd, -)"
            for mode in origin public; do
              body="$(mktemp)"
              headers="$(mktemp)"
              args=()
              if [[ "$mode" == origin ]]; then args+=(--resolve "$host:443:$IP"); fi
              if curl --noproxy '*' --fail --silent --show-error --max-time 20 "${args[@]}" -H 'Cache-Control: no-cache' -D "$headers" "https://$host/" -o "$body" -w 'remote=%{remote_ip} status=%{http_code}\n'; then
                echo "$host $mode index SHA256: $(sha256sum "$body" | cut -d ' ' -f1)"
                grep -Ei '^(server|cache-control|age|etag|last-modified|via|x-cache|content-type):' "$headers" || true
                grep -oE '/assets/[^" ]+\.(js|css)' "$body" | head -10 || true
              else
                echo "::warning::$host $mode HTTPS request failed"
              fi
              rm -f "$body" "$headers"
            done
          done

      - name: Verify exact release on both public production hostnames
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum frontend/dist/index.html | cut -d ' ' -f1)"
          echo "Expected deployed index SHA256: $expected"
          for host in broandbro.in www.broandbro.in; do
            for route in / /login /register; do
              matched=false
              for attempt in $(seq 1 5); do
                body="$(mktemp)"
                if curl --noproxy '*' --fail --silent --show-error --location --max-time 20 \
                    -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                    "https://$host$route" -o "$body"; then
                  actual="$(sha256sum "$body" | cut -d ' ' -f1)"
                  if [[ "$actual" == "$expected" ]]; then
                    matched=true
                  else
                    echo "$host$route returned a different index SHA256: $actual"
                  fi
                fi
                rm -f "$body"
                [[ "$matched" == true ]] && break
                sleep 3
              done
              if [[ "$matched" != true ]]; then
                echo "::error::Public production $host$route does not serve the deployed release"
                exit 1
              fi
              echo "$host$route serves exact deployed release"
            done
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import hashlib
          import urllib.request

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  path = attrs.get("src") if tag == "script" else attrs.get("href") if tag == "link" else None
                  if path and path.startswith("/assets/"):
                      self.paths.add(path)

          parser = Assets()
          parser.feed(Path("frontend/dist/index.html").read_text())
          assert parser.paths, "No frontend entry assets found"
          for host in ("broandbro.in", "www.broandbro.in"):
              for path in sorted(parser.paths):
                  expected = hashlib.sha256((Path("frontend/dist") / path.lstrip("/")).read_bytes()).hexdigest()
                  req = urllib.request.Request("https://" + host + path, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  assert actual == expected, f"{host}{path} differs from deployed release"
                  print(f"{host}{path}: exact asset verified")
          PY
          echo "- Public root, login, registration and entry assets: exact build verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          echo "## Frontend staging status (new AWS account)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build:** Uploaded to private S3 and exact HTML published to EC2/Nginx" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.preview_dns.outputs.ready }}" == "true" ]]; then
            echo "- **Preview:** HTTPS verified at https://migrate-prod.broandbro.in" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Preview:** NOT HTTPS-ready; waiting for public preview DNS delegation, certificate not attempted" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Bucket:** ${{ env.S3_BUCKET }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Public main-domain release:** Exact deployed HTML and entry assets verified; no DNS changes performed" >> "$GITHUB_STEP_SUMMARY"
