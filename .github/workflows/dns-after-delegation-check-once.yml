name: One-time verify BroBro DNS delegation and HTTPS readiness
on:
  push:
    branches: [main]
    paths: [.github/workflows/dns-after-delegation-check-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Public authoritative DNS, HTTP and HTTPS checks
        run: |
          echo "REGISTRAR DELEGATION"; dig +short NS broandbro.in
          for HOST in broandbro.in www.broandbro.in api.broandbro.in migrate-prod.broandbro.in migrate-prod-api.broandbro.in; do
            echo "HOST $HOST"
            dig +short "$HOST" A || true
            curl --noproxy '*' --connect-timeout 5 --max-time 12 -sS -o /dev/null -w "HTTP $HOST %{http_code}\n" "http://$HOST/" || true
            curl --noproxy '*' --connect-timeout 5 --max-time 12 -sS -o /dev/null -w "HTTPS $HOST %{http_code}\n" "https://$HOST/" || true
          done
          echo "MAIL MX"; dig +short MX broandbro.in
          echo "MAIL SPF"; dig +short TXT broandbro.in
          echo "DMARC"; dig +short TXT _dmarc.broandbro.in
