# P0 migration safety freeze (2026-11-15).
# Replaces legacy deployment workflow until new-account production rollout is verified.
# Previous implementation remains accessible in git history.
# No AWS identity assumption, Terraform state read/write, upload, deployment, DNS change,
# or DEV infrastructure can occur via this workflow.
name: Terraform Apply-Prod (Legacy Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    name: Legacy release freeze (no AWS actions)
    runs-on: ubuntu-latest
    steps:
      - name: Explain release freeze
        shell: bash
        run: |
          echo "::warning::Legacy Bro & Bro deployment intentionally disabled during single-PROD new-account migration."
          echo "::notice::Terraform apply previously auto-triggered on main infra changes and used the old backend."
          echo "This run makes no changes. Do not use legacy deploy workflows."
          echo "Use the separately reviewed new-account PROD deployment after preview verification and approval."
