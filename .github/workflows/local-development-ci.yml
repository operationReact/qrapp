name: Local development validation
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/local-prod-proxy*"
      - "frontend/vite.config.js"
      - "frontend/.env.*"
      - "frontend/package.json"
      - "frontend/src/services/index.js"
      - "backend/src/main/resources/application-local.yml"
      - "backend/src/main/java/com/broandbro/qrapp/config/LocalDevelopmentGuard.java"
      - "backend/src/test/java/com/broandbro/qrapp/config/LocalDevelopmentGuardTest.java"
      - ".run/**"
      - "compose.local.yml"
      - ".github/workflows/local-development-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate run configurations and proxy safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path(".run").glob("*.run.xml"))
          assert len(files) >= 5
          for f in files:
              ET.parse(f)
              print(f)
          PY
          cd frontend
          npm run test:local-proxy
          npm ci --no-audit --no-fund
          npm run build
      - name: Verify production proxy integration without writes
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run dev:prod-api > "$RUNNER_TEMP/vite-prod-api.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true; cat "$RUNNER_TEMP/vite-prod-api.log"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:5173/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5173/__prod_api/auth/login)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://untrusted.example' http://localhost:5173/__prod_api/api/locations/public)" = 403
          curl --fail --max-time 20 --silent http://localhost:5173/__prod_api/api/locations/public | python3 -c 'import json,sys; x=json.load(sys.stdin); assert isinstance(x,(list,dict)); print("Production API read succeeded")'
  local-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: broandbro_local
          POSTGRES_USER: broandbro_local
          POSTGRES_PASSWORD: brobro-local-only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U broandbro_local -d broandbro_local" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile and validate local safeguards
        run: gradle :backend:test --tests '*LocalDevelopmentGuardTest' :backend:bootJar --no-daemon
      - name: Boot isolated local backend
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_CLOUD_AWS_PARAMETERSTORE_ENABLED: "false"
          AWS_REGION: ap-south-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          jar="$(find backend/build/libs -maxdepth 1 -name '*.jar' ! -name '*plain*' | head -n1)"
          test -n "$jar"
          java -jar "$jar" > "$RUNNER_TEMP/local-backend.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -100 "$RUNNER_TEMP/local-backend.log"' EXIT
          for attempt in {1..90}; do
            kill -0 "$pid" || exit 1
            if curl -fsS --max-time 3 http://127.0.0.1:8080/api/payment/config >/dev/null; then
              echo "Local backend ready against isolated PostgreSQL"
              exit 0
            fi
            sleep 2
          done
          exit 1
