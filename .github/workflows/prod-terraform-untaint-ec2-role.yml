name: Repair Bro and Bro PROD tainted EC2 IAM role (state only)

# Scope: one-time, exact tainted EC2 IAM role state correction.
# Never Terraform Apply, destroy, modify IAM, change DNS or handle secrets.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-terraform-untaint-ec2-role.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-new-account-prod
  cancel-in-progress: false

jobs:
  repair-state-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: "true"
      TF_VAR_expected_account_id: ${{ vars.AWS_NEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false
      - name: Confirm exact production AWS account and state bucket settings
        env:
          ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_BUCKET_REGION }}
        run: |
          set -euo pipefail
          test "$ACCOUNT" = "098859530205"
          test "$STATE_BUCKET" = "broandbro-tfstate-098859530205-ap-south-1"
          test "$STATE_REGION" = "us-east-1"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
          role-duration-seconds: 7200
          role-session-name: broandbro-prod-safe-untaint
      - name: Remove verified taint marker with protected state backup and new read-only plan
        run: python3 scripts/untaint-prod-ec2-role.py
      - name: Publish state-only recovery status
        run: |
          echo "## Bro & Bro PROD EC2 IAM role state recovery" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact IAM role verified and state marker corrected, without Terraform Apply." >> "$GITHUB_STEP_SUMMARY"
          echo "Plan was parsed privately and showed no destructive changes." >> "$GITHUB_STEP_SUMMARY"
          echo "No application deployment, DNS changes or vendor-secret updates were attempted." >> "$GITHUB_STEP_SUMMARY"
