name: One-time provision BroBro production super admin
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/provision-prod-super-admin.yml"
      - "scripts/ProvisionSuperAdmin.java"
      - "scripts/provision-prod-super-admin.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-prod-super-admin.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: broandbro-prod-super-admin-provision
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - name: Compile provisioning helper and validate Python
        run: |
          set -euo pipefail
          javac --release 21 -d "$RUNNER_TEMP" scripts/ProvisionSuperAdmin.java
          python3 -m py_compile scripts/provision-prod-super-admin.py
          python3 - <<'PY'
          import runpy
          validate = runpy.run_path("scripts/provision-prod-super-admin.py")["validate_credentials"]
          for value in ("9876543210", "+91 98765 43210", "919876543210", "09876543210"):
              assert validate(value, "sample passphrase") == "9876543210"
          for phone, password, message in [
              ("", "sample passphrase", "PHONE is missing"),
              ("9876543210", "", "PASSWORD is missing"),
              ("123", "sample passphrase", "valid Indian mobile"),
              ("9876543210", "short", "at least 12"),
              ("9876543210", "a" * 73, "72-byte"),
              ("9876543210", " " * 12, "must not be blank"),
          ]:
              try:
                  validate(phone, password)
              except RuntimeError as e:
                  assert message in str(e), str(e)
              else:
                  raise AssertionError("Invalid credential accepted")
          print("Credential validation tests passed")
          PY
  provision:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Provision and verify production super-admin login
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          SUPER_ADMIN_PHONE: ${{ secrets.SUPER_ADMIN_PHONE }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
        run: python3 scripts/provision-prod-super-admin.py
