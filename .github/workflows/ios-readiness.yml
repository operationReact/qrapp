name: iOS Readiness

on:
  pull_request:
    branches: [dev]
    paths:
      - "frontend/**"
      - ".github/workflows/ios-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  ios-simulator-build:
    name: Build Capacitor app for iOS simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build production web bundle
        working-directory: frontend
        env:
          VITE_API_URL: "https://api.broandbro.in"
          VITE_ENV: "prod"
          NODE_ENV: "production"
        run: npm run build:prod

      - name: Generate and harden iOS project
        working-directory: frontend
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          npm run ios:configure

      - name: Verify privacy purpose strings
        working-directory: frontend
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          grep -q "NSLocationWhenInUseUsageDescription" "$PLIST"
          grep -q "NSPhotoLibraryUsageDescription" "$PLIST"
          echo "iOS privacy purpose strings verified"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS simulator target
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: brobro-ios-project
          path: frontend/ios
          if-no-files-found: error
          retention-days: 7
