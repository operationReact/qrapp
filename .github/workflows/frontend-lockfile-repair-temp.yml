name: Temporary frontend lockfile repair (Node 22)
on:
  push:
    branches:
      - fix/brobro-frontend-lockfile-ci
    paths:
      - .github/workflows/frontend-lockfile-repair-temp.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile (no package upgrades requested)
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit and push regenerated lockfile to isolated fix branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "fix(frontend): sync npm lockfile using Node 22"
            git push origin HEAD:fix/brobro-frontend-lockfile-ci
          fi
      - name: Validate clean install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
