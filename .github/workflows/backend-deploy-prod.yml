name: Backend Deploy-Prod

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/backend-deploy-prod.yml"
      - "infra/modules/ec2/userdata.sh"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger"

permissions:
  id-token: write   # required for OIDC → AWS
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Prod EC2
    runs-on: ubuntu-latest
    environment: prod   # ← triggers the required-reviewers approval gate

    steps:
      # Step 1: Checkout
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Step 2: Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "21"
          distribution: corretto

      # Step 2b: Cache Gradle distribution + downloaded dependencies
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle/gradle-8.7
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-8.7-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.7-

      # Step 3: Build JAR
      # Install Gradle 8.7 directly from the official distribution so we never
      # depend on a committed gradle-wrapper.jar (which is blocked by *.jar in
      # .gitignore and therefore always empty in this repo).
      - name: Install Gradle 8.7
        run: |
          if [ ! -f /opt/gradle/gradle-8.7/bin/gradle ]; then
            echo "⬇️ Cache miss – downloading Gradle 8.7..."
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
          else
            echo "✅ Gradle 8.7 restored from cache – skipping download"
          fi
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Spring Boot JAR
        run: gradle :backend:bootJar -x test --no-daemon

      # Step 4: Authenticate to AWS via OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Step 5: Fetch configuration from AWS Parameter Store
      - name: Fetch configuration from AWS Parameter Store
        run: |
          get_optional_parameter() {
            local parameter_name="$1"
            local parameter_value
            if parameter_value=$(aws ssm get-parameter \
              --name "$parameter_name" \
              --with-decryption \
              --query "Parameter.Value" --output text --region us-east-1 2>/dev/null); then
              printf '%s' "$parameter_value"
            else
              echo "::warning::Optional SSM parameter not found: $parameter_name" >&2
              printf ''
            fi
          }

          # Terraform publishes the same database parameter shape for every environment.
          DB_URL=$(aws ssm get-parameter \
            --name "/broandbro/backend/prod/database/url" \
            --query "Parameter.Value" --output text --region us-east-1)
          DB_USERNAME=$(aws ssm get-parameter \
            --name "/broandbro/backend/prod/database/username" \
            --query "Parameter.Value" --output text --region us-east-1)
          DB_PASSWORD=$(aws ssm get-parameter \
            --name "/broandbro/backend/prod/database/password" \
            --with-decryption \
            --query "Parameter.Value" --output text --region us-east-1)

          # Fetch service credentials
          OPENAI_API_KEY=$(get_optional_parameter "/broandbro/backend/prod/openai/apiKey")

          S3_BUCKET=$(get_optional_parameter "/broandbro/backend/prod/aws/s3/bucketName")
          S3_BUCKET=${S3_BUCKET:-broandbro-prod-root-bucket}
          S3_LOCATION_BUCKET=broandbro-location-images-prod
          S3_REGION=us-east-1
          S3_ENABLED=$(get_optional_parameter "/broandbro/backend/prod/aws/s3/enabled")
          S3_ENABLED=${S3_ENABLED:-true}

          RAZORPAY_KEY=$(get_optional_parameter "/broandbro/backend/prod/razorpay/key")
          RAZORPAY_SECRET=$(get_optional_parameter "/broandbro/backend/prod/razorpay/secret")
          # Required: enforced by the validation step below with a clear error message.
          RAZORPAY_WEBHOOK_SECRET=$(get_optional_parameter "/broandbro/backend/prod/razorpay/webhookSecret")

          WHATSAPP_WEBHOOK_VERIFY_TOKEN=$(get_optional_parameter "/broandbro/backend/prod/whatsapp/webhookVerifyToken")
          WHATSAPP_APP_SECRET=$(get_optional_parameter "/broandbro/backend/prod/whatsapp/appSecret")
          WHATSAPP_PHONE_NUMBER_ID=$(get_optional_parameter "/broandbro/backend/prod/whatsapp/phoneNumberId")
          WHATSAPP_ACCESS_TOKEN=$(get_optional_parameter "/broandbro/backend/prod/whatsapp/accessToken")

          for VARIABLE in DB_URL DB_USERNAME DB_PASSWORD OPENAI_API_KEY RAZORPAY_KEY RAZORPAY_SECRET RAZORPAY_WEBHOOK_SECRET WHATSAPP_WEBHOOK_VERIFY_TOKEN WHATSAPP_APP_SECRET WHATSAPP_PHONE_NUMBER_ID WHATSAPP_ACCESS_TOKEN; do
            if [ -n "${!VARIABLE}" ]; then
              printf '::add-mask::%s\n' "${!VARIABLE}"
            fi
          done

          # Store in environment for next step
          echo "DB_URL=$DB_URL" >> $GITHUB_ENV
          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> $GITHUB_ENV
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
          echo "S3_LOCATION_BUCKET=$S3_LOCATION_BUCKET" >> $GITHUB_ENV
          echo "S3_REGION=$S3_REGION" >> $GITHUB_ENV
          echo "S3_ENABLED=$S3_ENABLED" >> $GITHUB_ENV
          echo "RAZORPAY_KEY=$RAZORPAY_KEY" >> $GITHUB_ENV
          echo "RAZORPAY_SECRET=$RAZORPAY_SECRET" >> $GITHUB_ENV
          echo "RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET" >> $GITHUB_ENV
          echo "WHATSAPP_WEBHOOK_VERIFY_TOKEN=$WHATSAPP_WEBHOOK_VERIFY_TOKEN" >> $GITHUB_ENV
          echo "WHATSAPP_APP_SECRET=$WHATSAPP_APP_SECRET" >> $GITHUB_ENV
          echo "WHATSAPP_PHONE_NUMBER_ID=$WHATSAPP_PHONE_NUMBER_ID" >> $GITHUB_ENV
          echo "WHATSAPP_ACCESS_TOKEN=$WHATSAPP_ACCESS_TOKEN" >> $GITHUB_ENV
          echo "APP_CORS_ALLOWED_ORIGINS=https://broandbro.in,https://www.broandbro.in" >> $GITHUB_ENV
          echo "✅ Configuration fetched from AWS Parameter Store"

      - name: Validate WhatsApp webhook configuration
        run: |
          for REQUIRED in WHATSAPP_WEBHOOK_VERIFY_TOKEN WHATSAPP_APP_SECRET WHATSAPP_PHONE_NUMBER_ID WHATSAPP_ACCESS_TOKEN; do
            if [ -z "${!REQUIRED}" ]; then
              echo "❌ $REQUIRED not found in SSM for prod. Aborting deploy." >&2
              exit 1
            fi
          done
          echo "✅ WhatsApp configuration present"

          if [ -z "$RAZORPAY_WEBHOOK_SECRET" ]; then
            echo "❌ RAZORPAY_WEBHOOK_SECRET not found in SSM for prod. Aborting deploy." >&2
            exit 1
          fi
          echo "✅ Razorpay webhook configuration present"

      # Step 6: Fetch EC2 host from SSM (populated by Terraform)
      - name: Get EC2 host from SSM
        id: ec2
        run: |
          IP=$(aws ssm get-parameter \
            --name "/broandbro/prod/ec2-public-ip" \
            --query "Parameter.Value" \
            --output text \
            --region us-east-1 2>/dev/null || true)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::warning::SSM parameter /broandbro/prod/ec2-public-ip not found; resolving host from EC2 tag"
            MATCH_COUNT=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=broandbro-prod-backend" \
                "Name=instance-state-name,Values=running" \
              --query "length(Reservations[].Instances[])" \
              --output text \
              --region us-east-1 2>/dev/null || echo "__ERROR__")

            if ! [[ "$MATCH_COUNT" =~ ^[0-9]+$ ]]; then
              echo "❌ Failed to resolve EC2 instance count for Name=broandbro-prod-backend"
              exit 1
            fi

            if [ "$MATCH_COUNT" -gt 1 ]; then
              echo "❌ Found multiple running EC2 instances with Name=broandbro-prod-backend; refusing ambiguous deploy target"
              exit 1
            fi
            if [ "$MATCH_COUNT" -eq 0 ]; then
              echo "❌ No running EC2 instance found with Name=broandbro-prod-backend"
              exit 1
            fi

            IP=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=broandbro-prod-backend" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text \
              --region us-east-1)
          fi

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "❌ Unable to resolve prod EC2 public IP from SSM or EC2 tags"
            exit 1
          fi
          echo "host=$IP" >> "$GITHUB_OUTPUT"

      # Step 7: Fetch SSH private key from SSM (SecureString)
      - name: Get SSH private key from SSM
        id: ssh
        run: |
          KEY=$(aws ssm get-parameter \
            --name "/broandbro/prod/ec2-ssh-private-key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          echo "$KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      # Step 8: Upload JAR to S3
      # Replacing the old SCP approach (GitHub runner US → Mumbai EC2 = ~30 min).
      # The runner uploads to S3 in us-east-1; the EC2 pulls it from S3 in the
      # same region over the AWS backbone – typically <30 seconds total.
      # A pre-signed URL is generated so the EC2 can download without needing
      # its own s3:GetObject IAM permission on the deploy/ prefix.
      - name: Upload JAR to S3
        run: |
          echo "📦 Uploading JAR to S3 (us-east-1)..."
          time aws s3 cp \
            backend/build/libs/qrapp-*.jar \
            s3://broandbro-prod-root-bucket/deploy/prod/${{ github.run_id }}/app.jar \
            --region us-east-1
          echo "✅ S3 upload complete"

          # Pre-signed URL valid for 10 minutes – plenty of time for the SSH deploy step
          PRESIGNED=$(aws s3 presign \
            s3://broandbro-prod-root-bucket/deploy/prod/${{ github.run_id }}/app.jar \
            --expires-in 600 \
            --region us-east-1)
          echo "JAR_URL=$PRESIGNED" >> "$GITHUB_ENV"

      # Step 9: Write application.env + restart service
      # All secrets are injected here — nothing sensitive is ever stored in files
      # in the repo.  The env file is written with 640 permissions (broandbro user
      # only) and is never echoed in logs.
      - name: Deploy & restart
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ec2-user@${{ steps.ec2.outputs.host }} << 'ENDSSH'

            set -euo pipefail

            # Pull the JAR via pre-signed URL – no IAM credentials needed on EC2
            echo "⬇️ Downloading JAR from S3..."
            curl -fsSL -o /tmp/app-new.jar "${{ env.JAR_URL }}"

            # Backup existing JAR
            [ -f /opt/broandbro/app.jar ] && \
              sudo cp /opt/broandbro/app.jar /opt/broandbro/app.jar.bak || true

            # Move new JAR into place
            sudo mv /tmp/app-new.jar /opt/broandbro/app.jar
            sudo chown broandbro:broandbro /opt/broandbro/app.jar

            # Write environment file (secrets injected at deploy time)
            # Configuration fetched from AWS Parameter Store
            sudo tee /opt/broandbro/config/application.env > /dev/null << EOF
          # Spring
          SPRING_PROFILES_ACTIVE=prod
          SERVER_PORT=8080

          # Database
          SPRING_DATASOURCE_URL=${{ env.DB_URL }}
          SPRING_DATASOURCE_USERNAME=${{ env.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ env.DB_PASSWORD }}

          # OpenAI (AI image generation)
          OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL=gpt-image-1
          OPENAI_IMAGE_SIZE=1024x1024

          WHATSAPP_WEBHOOK_VERIFY_TOKEN=${{ env.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET=${{ env.WHATSAPP_APP_SECRET }}
          WHATSAPP_OTP_ENABLED=true
          WHATSAPP_PHONE_NUMBER_ID=${{ env.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN=${{ env.WHATSAPP_ACCESS_TOKEN }}

          # AWS S3 (shared media bucket)
          AWS_S3_BUCKET_NAME=${{ env.S3_BUCKET }}
          AWS_S3_LOCATION_BUCKET_NAME=${{ env.S3_LOCATION_BUCKET }}
          AWS_S3_REGION=${{ env.S3_REGION }}
          AWS_S3_ENABLED=${{ env.S3_ENABLED }}
          # S3 credentials come from the EC2 instance IAM role (default credential chain).
          APP_CORS_ALLOWED_ORIGINS=${{ env.APP_CORS_ALLOWED_ORIGINS }}

          # Razorpay
          RAZORPAY_KEY=${{ env.RAZORPAY_KEY }}
          RAZORPAY_SECRET=${{ env.RAZORPAY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ env.RAZORPAY_WEBHOOK_SECRET }}

          EOF

            sudo chmod 640 /opt/broandbro/config/application.env
            sudo chown broandbro:broandbro /opt/broandbro/config/application.env

            # Restart service
            sudo systemctl daemon-reload
            sudo systemctl restart broandbro

            # Configure HTTPS after DNS points api.broandbro.in to this host.
            if [ ! -d /etc/letsencrypt/live/api.broandbro.in ]; then
              sudo certbot --nginx \
                -d api.broandbro.in \
                --email admin@broandbro.in \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                --redirect
            else
              sudo certbot renew --quiet
            fi
            # Apply the upload limit at http context level so it also covers
            # HTTPS server blocks generated or modified by certbot.
            sudo tee /etc/nginx/conf.d/zz-broandbro-upload-limit.conf > /dev/null <<'NGINX'
            client_max_body_size 25m;
            NGINX
            while IFS= read -r nginx_config; do
              sudo sed -i -E 's/client_max_body_size[[:space:]]+[0-9]+[mMgG];/client_max_body_size 25m;/g' "$nginx_config"
            done < <(sudo grep -RIl --include='*.conf' 'client_max_body_size' /etc/nginx || true)
            sudo nginx -T 2>/dev/null | grep -E 'client_max_body_size' || true
            sudo nginx -t
            sudo systemctl reload nginx
            sudo ss -ltn '( sport = :443 )' | grep -q LISTEN
            echo "HTTPS is listening on port 443"

            # Type=simple becomes active before Spring Boot is ready to serve HTTP.
            READY=false
            DEADLINE=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$DEADLINE" ]; do
              STATUS=$(sudo systemctl is-active broandbro 2>/dev/null || true)
              HTTP_STATUS=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:8080/api/payment/config" || true)
              echo "Service status: $STATUS; local API HTTP status: $HTTP_STATUS"
              if [ "$STATUS" = "active" ] && [ "$HTTP_STATUS" = "200" ]; then
                READY=true
                echo "✅ broandbro is serving HTTP requests"
                break
              fi
              sleep 5
            done
            if [ "$READY" != "true" ]; then
              echo "❌ Backend did not become HTTP-ready within 180 seconds"
              sudo journalctl -u broandbro -n 100 --no-pager || true
              sudo ss -ltn '( sport = :8080 or sport = :443 )' || true
              exit 1
            fi

            if ! curl --fail --silent --show-error --retry 10 --retry-delay 5 \
              --connect-timeout 5 --max-time 10 \
              "https://api.broandbro.in/api/payment/config" > /dev/null; then
              echo "❌ Production HTTPS smoke test failed after local API readiness"
              sudo journalctl -u broandbro -n 100 --no-pager || true
              sudo ss -ltn '( sport = :8080 or sport = :443 )' || true
              exit 1
            fi
            echo "Production API HTTPS smoke test passed"
          ENDSSH

      # ── 10. Cleanup ───────────────────────────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key

      - name: Cleanup S3 deploy artifact
        if: always()
        run: |
          aws s3 rm \
            s3://broandbro-prod-root-bucket/deploy/prod/${{ github.run_id }}/app.jar \
            || true
