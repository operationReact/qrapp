name: Backend Deploy prod (new account, SSM)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: broandbro-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build JAR
        run: gradle :backend:bootJar --no-daemon
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify account and resolve deployment resources
        id: target
        env:
          ACCOUNT_ID: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || exit 1
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID" || {
            echo "::error::Wrong AWS account"; exit 1;
          }
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || {
            echo "::error::Expected exactly one running EC2 instance"; exit 1;
          }
          BUCKET="$(aws ssm get-parameter \
            --name '/broandbro/backend/prod/aws/s3/artifactBucketName' \
            --query 'Parameter.Value' --output text)"
          test "$BUCKET" = "broandbro-prod-artifacts-$ACCOUNT_ID" || {
            echo "::error::Wrong artifact bucket"; exit 1;
          }
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
      - name: Upload secret-free JAR and deployment agent
        env:
          ARTIFACT_BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          set -euo pipefail
          PREFIX="s3://$ARTIFACT_BUCKET/deploy/prod/$GITHUB_RUN_ID"
          JAR="$(find backend/build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$JAR" || exit 1
          aws s3 cp "$JAR" "$PREFIX/app.jar" --only-show-errors
          aws s3 cp scripts/deploy-backend-from-ssm.py "$PREFIX/deploy.py" --only-show-errors
      - name: Deploy over Systems Manager (no SSH or S3-stored secrets)
        env:
          INSTANCE_ID: ${{ steps.target.outputs.id }}
          ARTIFACT_BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          set -euo pipefail
          PREFIX="s3://$ARTIFACT_BUCKET/deploy/prod/$GITHUB_RUN_ID"
          COMMAND="aws s3 cp $PREFIX/deploy.py /tmp/broandbro-deploy.py --only-show-errors && python3 /tmp/broandbro-deploy.py prod $PREFIX/app.jar"
          python3 -c 'import json,sys; json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$COMMAND" "$RUNNER_TEMP/ssm-parameters.json"
          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --timeout-seconds 900 \
            --comment "broandbro-prod-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success) echo "Deployment healthy"; exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent}' --output json || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::SSM deployment timed out"; exit 1
