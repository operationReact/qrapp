# =============================================================================
# Workflow: backend-deploy-prod.yml
# Triggered by push to `main` branch when backend/** changes.
# Builds Spring Boot JAR, SCPs it to PROD EC2, restarts with rollback.
# Requires manual approval via the "prod" GitHub Environment.
# =============================================================================
name: Backend Deploy – Prod

on:
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  id-token: write
  contents: read

env:
  JAVA_VERSION: "21"
  AWS_REGION: "ap-south-1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Spring Boot JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  # installs Gradle, handles caching

      - name: Run tests
        # Run from repo root – settings.gradle includes 'backend' as a subproject
        run: gradle :backend:test --no-daemon --parallel

      - name: Build JAR
        run: gradle :backend:bootJar -x test --no-daemon --parallel

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-prod
          path: backend/build/libs/*.jar
          retention-days: 14  # Keep longer for prod rollback

  deploy:
    name: Deploy to Prod EC2
    runs-on: ubuntu-latest
    needs: build
    environment: prod  # ← Requires manual approval

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar-prod
          path: ./jar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fetch SSH private key from SSM – no manual GitHub secret needed
      - name: Setup SSH key (from SSM)
        run: |
          mkdir -p ~/.ssh
          aws ssm get-parameter \
            --name "/broandbro/prod/ec2-ssh-private-key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text > ~/.ssh/broandbro_prod
          chmod 600 ~/.ssh/broandbro_prod
          ssh-keyscan -H ${{ secrets.PROD_EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure HTTPS (certbot) is configured on EC2
        run: |
          ssh -i ~/.ssh/broandbro_prod \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.PROD_EC2_HOST }} \
          '
          set -e
          DOMAIN="api.broandbro.in"
          CERT_PATH="/etc/letsencrypt/live/$DOMAIN/fullchain.pem"

          echo "--- Checking HTTPS / certbot status ---"

          # Install certbot if missing (idempotent)
          if ! command -v certbot &>/dev/null; then
            echo "Installing certbot..."
            sudo dnf install -y python3 python3-pip augeas-libs 2>/dev/null || true
            sudo pip3 install certbot certbot-nginx --quiet
            sudo ln -sf /usr/local/bin/certbot /usr/bin/certbot || true
          fi

          sudo mkdir -p /var/www/certbot
          sudo chown nginx:nginx /var/www/certbot 2>/dev/null || true

          if ! sudo grep -q "well-known/acme-challenge" /etc/nginx/conf.d/broandbro.conf 2>/dev/null; then
            sudo sed -i "/listen 80/a\\    location /.well-known/acme-challenge/ { root /var/www/certbot; try_files \$uri =404; }" \
              /etc/nginx/conf.d/broandbro.conf
            sudo nginx -t && sudo systemctl reload nginx
          fi

          if [ -f "$CERT_PATH" ]; then
            echo "✅ Certificate already exists for $DOMAIN – skipping issuance"
            sudo certbot renew --quiet --nginx --deploy-hook "systemctl reload nginx" || true
          else
            echo "🔐 Issuing Let'\''s Encrypt certificate for $DOMAIN..."
            sudo certbot --nginx \
              --non-interactive \
              --agree-tos \
              --email admin@broandbro.in \
              --domains "$DOMAIN" \
              --redirect
            echo "✅ Certificate issued and Nginx updated for HTTPS"
          fi

          sudo nginx -t
          sudo systemctl reload nginx
          echo "--- Nginx HTTPS status ---"
          sudo ss -tlnp | grep 443 && echo "✅ Port 443 is listening" || echo "❌ WARNING: Port 443 not listening"
          '

      - name: Write application.env to EC2
        run: |
          DB_PASSWORD=$(aws ssm get-parameter \
            --name "/broandbro/prod/db-password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          ssh -i ~/.ssh/broandbro_prod \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.PROD_EC2_HOST }} \
          "sudo mkdir -p /opt/broandbro/config
           {
             printf 'SPRING_PROFILES_ACTIVE=prod\n'
             printf 'SERVER_PORT=8080\n'
             printf 'SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.PROD_DB_HOST }}:5432/${{ secrets.PROD_DB_NAME }}\n'
             printf 'SPRING_DATASOURCE_USERNAME=broandbro\n'
             printf 'SPRING_DATASOURCE_PASSWORD=%s\n' \"$DB_PASSWORD\"
             printf 'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=10\n'
             printf 'SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=30000\n'
           } | sudo tee /opt/broandbro/config/application.env > /dev/null
           sudo chown broandbro:broandbro /opt/broandbro/config/application.env
           sudo chmod 640 /opt/broandbro/config/application.env"

      - name: SCP JAR to EC2
        run: |
          JAR_FILE=$(ls jar/*.jar | head -1)
          echo "Deploying: $JAR_FILE"
          scp -i ~/.ssh/broandbro_prod \
              -o StrictHostKeyChecking=no \
              "$JAR_FILE" \
              ec2-user@${{ secrets.PROD_EC2_HOST }}:/tmp/app-new.jar

      - name: Deploy with rollback safety
        run: |
          ssh -i ~/.ssh/broandbro_prod \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.PROD_EC2_HOST }} \
          '
          set -e
          echo "--- Starting prod deployment ---"

          # Save current JAR timestamp for rollback log
          CURRENT_JAR_TS=$(stat -c %Y /opt/broandbro/app.jar 2>/dev/null || echo "none")
          echo "Current JAR timestamp: $CURRENT_JAR_TS"

          # Backup current JAR
          [ -f /opt/broandbro/app.jar ] && \
            sudo cp /opt/broandbro/app.jar /opt/broandbro/app.jar.bak && \
            echo "Backup created: app.jar.bak"

          # Atomic move
          sudo mv /tmp/app-new.jar /opt/broandbro/app.jar
          sudo chown broandbro:broandbro /opt/broandbro/app.jar
          sudo chmod 640 /opt/broandbro/app.jar

          echo "--- Restarting service ---"
          sudo systemctl restart broandbro

          echo "--- Health check (waiting up to 3 minutes) ---"
          HEALTHY=false
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(sudo systemctl is-active broandbro 2>/dev/null)
            echo "[$i/36] service status: $STATUS"
            if [ "$STATUS" = "active" ]; then
              HEALTHY=true
              break
            fi
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment FAILED – rolling back"
            if [ -f /opt/broandbro/app.jar.bak ]; then
              sudo cp /opt/broandbro/app.jar.bak /opt/broandbro/app.jar
              sudo systemctl restart broandbro
              sleep 10
              sudo systemctl is-active broandbro && echo "✅ Rollback successful" || echo "❌ Rollback also failed"
            fi
            sudo journalctl -u broandbro -n 100 --no-pager
            exit 1
          fi
          '

      - name: Deployment summary
        run: |
          echo "## ✅ Backend Deployed – Prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** https://api.broandbro.in" >> $GITHUB_STEP_SUMMARY
          echo "- **EC2 Host:** ${{ secrets.PROD_EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

