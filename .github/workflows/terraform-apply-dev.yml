# =============================================================================
# Workflow: terraform-apply-dev.yml
# Triggered by push to `dev` branch when infra/** changes.
# Applies Terraform to the DEV environment.
# =============================================================================
name: Terraform Apply – Dev

on:
  push:
    branches: [dev]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "ap-south-1"
  TF_ENV: dev
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply-dev:
    name: Terraform Apply – Dev
    runs-on: ubuntu-latest
    environment: dev  # Maps to GitHub Environment "dev"

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=broandbro-tfstate-ap-south-1" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=broandbro-tf-lock"

      - name: Terraform Validate
        run: terraform validate

      # ── Guard: fail early with a clear message if required secrets are missing
      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.DEV_DB_PASSWORD }}" ] && MISSING="$MISSING DEV_DB_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "❌ The following GitHub secrets are not set:$MISSING"
            echo "Go to: Settings → Environments → dev → Environment secrets"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Import existing S3 bucket (if orphaned)
        run: |
          if aws s3api head-bucket --bucket broandbro-dev-ui 2>/dev/null; then
            echo "Bucket exists – checking state..."
            if ! terraform state show module.s3.aws_s3_bucket.this 2>/dev/null; then
              echo "Importing orphaned S3 bucket into state..."
              terraform import \
                -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
                module.s3.aws_s3_bucket.this broandbro-dev-ui
            else
              echo "Bucket already in state – skipping."
            fi
          fi

      - name: Import existing EC2 Key Pair (if orphaned)
        run: |
          if aws ec2 describe-key-pairs --key-names broandbro-dev-key --region ap-south-1 2>/dev/null; then
            echo "Key pair exists – checking state..."
            if ! terraform state show module.ec2.aws_key_pair.this 2>/dev/null; then
              echo "Importing orphaned key pair into state..."
              terraform import \
                -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
                module.ec2.aws_key_pair.this broandbro-dev-key
            else
              echo "Key pair already in state – skipping."
            fi
          fi

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export outputs to GitHub summary
        run: |
          echo "## ✅ Dev Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL | https://dev.broandbro.in |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | https://dev-api.broandbro.in |" >> $GITHUB_STEP_SUMMARY
          CF_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "N/A")
          EC2_IP=$(terraform output -raw ec2_elastic_ip 2>/dev/null || echo "N/A")
          echo "| CloudFront ID | $CF_ID |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 IP | $EC2_IP |" >> $GITHUB_STEP_SUMMARY

