# =============================================================================
# Workflow: terraform-apply-dev.yml
# Triggered by push to `dev` branch when infra/** changes.
# Applies Terraform to the DEV environment.
# =============================================================================
name: Terraform Apply-Dev

on:
  push:
    branches: [dev]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply-dev.yml"
  workflow_dispatch:
    inputs:
      force_apply:
        description: "Force apply even without infra changes"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "us-east-1"
  TF_ENV: dev
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply-dev:
    name: Terraform Apply - Dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=broandbro-tfstate-us-east-1" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=broandbro-tf-lock"

      - name: Terraform Validate
        run: terraform validate

      - name: Validate required secrets
        run: |
          echo "No manual secrets required - DB password and SSH key are auto-generated."

      - name: Two-phase apply for ACM certificate
        shell: bash -e -o pipefail {0}
        run: |
          set +e
          
          echo "=== Phase 1: Create ACM certificate ==="
          if ! terraform state show module.acm.aws_acm_certificate.this 2>/dev/null; then
            terraform apply -target=module.acm.aws_acm_certificate.this -auto-approve
            TF_EXIT=$?
            if [ $TF_EXIT -ne 0 ] && [ $TF_EXIT -ne 1 ]; then exit $TF_EXIT; fi
          else
            echo "Certificate already in state"
          fi
          
          echo "=== Phase 2: Create validation records ==="
          if terraform state show module.acm.aws_acm_certificate.this 2>/dev/null; then
            terraform apply -target=module.acm.aws_route53_record.validation -target=module.acm.aws_acm_certificate_validation.this -auto-approve
            TF_EXIT=$?
            if [ $TF_EXIT -ne 0 ] && [ $TF_EXIT -ne 1 ]; then exit $TF_EXIT; fi
          fi
          exit 0

      - name: Import existing S3 bucket (if orphaned)
        run: |
          if aws s3api head-bucket --bucket broandbro-develop-ui 2>/dev/null; then
            echo "Bucket exists - checking state..."
            if ! terraform state show module.s3.aws_s3_bucket.this 2>/dev/null; then
              echo "Importing S3 bucket into state..."
              terraform import module.s3.aws_s3_bucket.this broandbro-develop-ui
            else
              echo "Bucket already in state"
            fi
          fi

      - name: Import existing EC2 Key Pair (if orphaned)
        run: |
          if aws ec2 describe-key-pairs --key-names broandbro-dev-key --region us-east-1 2>/dev/null; then
            echo "Key pair exists - checking state..."
            if ! terraform state show module.ec2.aws_key_pair.this 2>/dev/null; then
              echo "Importing key pair into state..."
              terraform import module.ec2.aws_key_pair.this broandbro-dev-key
            else
              echo "Key pair already in state"
            fi
          fi

      - name: Import shared media bucket (if exists)
        run: |
          BUCKET="${{ vars.MEDIA_BUCKET_NAME || 'broandbro-menu-images-shared' }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Media bucket $BUCKET exists - checking state..."
            STATE_OUTPUT=$(terraform state show aws_s3_bucket.media 2>/dev/null || true)
            if [ -z "$STATE_OUTPUT" ]; then
              echo "Importing media bucket..."
              terraform import aws_s3_bucket.media "$BUCKET"
            elif echo "$STATE_OUTPUT" | grep -q "(tainted)"; then
              echo "Removing taint and re-importing..."
              terraform state rm aws_s3_bucket.media
              terraform import aws_s3_bucket.media "$BUCKET"
            else
              echo "Media bucket already in state"
            fi
          else
            echo "Media bucket will be created by apply"
          fi

      - name: Import existing CloudFront distribution
        run: |
          echo "Checking for existing CloudFront with dev.broandbro.in..."
          DISTRIBUTIONS=$(aws cloudfront list-distributions --output json 2>/dev/null)
          
          # Find by CNAME
          CONFLICT_ID=$(echo "$DISTRIBUTIONS" | jq -r '.DistributionList.Items[] | select(.Aliases.Items[]? == "dev.broandbro.in") | .Id' 2>/dev/null | head -1 || echo "")
          
          # Fallback: find by comment
          if [ -z "$CONFLICT_ID" ]; then
            echo "Trying comment-based search..."
            CONFLICT_ID=$(echo "$DISTRIBUTIONS" | jq -r '.DistributionList.Items[] | select(.Comment == "broandbro-dev-frontend") | .Id' 2>/dev/null | head -1 || echo "")
          fi
          
          if [ -n "$CONFLICT_ID" ] && [ "$CONFLICT_ID" != "null" ] && [ "$CONFLICT_ID" != "" ]; then
            echo "Found CloudFront: $CONFLICT_ID"
            if terraform import module.cloudfront.aws_cloudfront_distribution.this "$CONFLICT_ID"; then
              echo "Successfully imported"
            else
              echo "Import failed"
              exit 1
            fi
          else
            echo "No CloudFront found"
          fi

      - name: Import existing RDS instance
        run: |
          if aws rds describe-db-instances --db-instance-identifier broandbro-dev --region us-east-1 2>/dev/null; then
            echo "RDS exists - checking state..."
            if ! terraform state show module.rds.aws_db_instance.this 2>/dev/null; then
              echo "Importing RDS..."
              terraform import module.rds.aws_db_instance.this broandbro-dev
            else
              echo "RDS already in state"
            fi
          else
            echo "RDS will be created"
          fi

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Verify no CNAME conflicts
        shell: bash
        run: |
          set -e
          echo "Final CNAME conflict check..."
          CF_STATE=$(terraform state show module.cloudfront.aws_cloudfront_distribution.this 2>/dev/null || true)
          
          if [ -z "$CF_STATE" ]; then
            DISTRIBUTIONS=$(aws cloudfront list-distributions --output json 2>/dev/null)
            CONFLICT_ID=$(echo "$DISTRIBUTIONS" | jq -r '.DistributionList.Items[] | select(.Aliases.Items[]? == "dev.broandbro.in") | .Id' 2>/dev/null | head -1 || echo "")
            
            if [ -n "$CONFLICT_ID" ] && [ "$CONFLICT_ID" != "null" ]; then
              echo "Conflict detected: $CONFLICT_ID"
              if terraform import module.cloudfront.aws_cloudfront_distribution.this "$CONFLICT_ID"; then
                echo "Imported. Re-planning..."
                terraform plan -out=tfplan
              else
                echo "Import failed"
                exit 1
              fi
            fi
          fi

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export outputs
        run: |
          echo "## Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://dev.broandbro.in |" >> $GITHUB_STEP_SUMMARY
          echo "| API | https://dev-api.broandbro.in |" >> $GITHUB_STEP_SUMMARY

