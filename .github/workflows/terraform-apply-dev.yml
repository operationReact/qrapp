name: "[DISABLED prod-only] Terraform Apply - New Account DEV"

# Migration deployments must never be triggered by a push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_NEW_DEV to provision the NEW AWS account only"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-new-account-dev
  cancel-in-progress: false

jobs:
  apply-dev:
    if: inputs.confirm == 'APPLY_NEW_DEV'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/environments/dev
    env:
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Refuse - production-only AWS decision (Nov 2026)
        run: |
          echo "::error::There is no DEV AWS environment. The owner approved ONE deployed environment: prod (098859530205)."
          echo "See infra/PROD_ONLY_RUNBOOK.md. This workflow is kept for reference only and must not create DEV resources."
          exit 1
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Require new-account configuration
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_ROLE: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          test -n "$EXPECTED_ACCOUNT" || { echo "::error::AWS_NEW_ACCOUNT_ID not configured"; exit 1; }
          test -n "$STATE_BUCKET" || { echo "::error::TF_STATE_BUCKET not configured"; exit 1; }
          test -n "$DEPLOY_ROLE" || { echo "::error::AWS_TERRAFORM_ROLE_ARN not configured"; exit 1; }
          case "$EXPECTED_ACCOUNT" in *[!0-9]*|"") exit 1 ;; esac
          test "${#EXPECTED_ACCOUNT}" -eq 12
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Assert AWS account before touching Terraform backend
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL" = "$EXPECTED_ACCOUNT" || { echo "::error::Refusing to access AWS account $ACTUAL"; exit 1; }
      - name: Require issued new-account CloudFront preview certificate
        env:
          CERT_ARN: ${{ vars.DEV_ACM_CERTIFICATE_ARN }}
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$CERT_ARN" =~ ^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$ ]] || {
            echo "::error::DEV_ACM_CERTIFICATE_ARN missing/invalid"; exit 1;
          }
          [[ "$CERT_ARN" == arn:aws:acm:us-east-1:"$EXPECTED_ACCOUNT":certificate/* ]] || exit 1
          [[ "$(aws acm describe-certificate --region us-east-1 --certificate-arn "$CERT_ARN" --query Certificate.Status --output text)" == "ISSUED" ]] || {
            echo "::error::CloudFront certificate is not ISSUED"; exit 1;
          }
          aws acm describe-certificate --region us-east-1 --certificate-arn "$CERT_ARN" \
            --query 'Certificate.SubjectAlternativeNames' --output json |
            jq -e 'index("migrate-dev.broandbro.in") != null' >/dev/null
      - name: Init isolated NEW account state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Format and validate
        run: |
          terraform validate
      - name: Plan
        env:
          TF_VAR_expected_account_id: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          TF_VAR_existing_certificate_arn: ${{ vars.DEV_ACM_CERTIFICATE_ARN }}
        run: terraform plan -input=false -out=tfplan
      - name: Apply reviewed plan
        env:
          TF_VAR_expected_account_id: ${{ vars.AWS_NEW_ACCOUNT_ID }}
          TF_VAR_existing_certificate_arn: ${{ vars.DEV_ACM_CERTIFICATE_ARN }}
        run: terraform apply -input=false tfplan
