# =============================================================================
# Workflow: terraform-apply-dev.yml
# Triggered by push to `dev` branch when infra/** changes.
# Applies Terraform to the DEV environment.
# =============================================================================
name: Terraform Apply-Dev

on:
  push:
    branches: [dev]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-apply-dev.yml"
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_apply:
        description: "Force apply even without infra changes"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "us-east-1"
  TF_ENV: dev
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply-dev:
    name: Terraform Apply – Dev
    runs-on: ubuntu-latest
    environment: dev  # Maps to GitHub Environment "dev"

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
           role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
           aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
           terraform init \
             -backend-config="bucket=broandbro-tfstate-us-east-1" \
             -backend-config="key=env/dev/terraform.tfstate" \
             -backend-config="region=us-east-1" \
             -backend-config="dynamodb_table=broandbro-tf-lock"

      - name: Terraform Validate
        run: terraform validate

      ## ── Guard: fail early with a clear message if required secrets are missing
      - name: Validate required secrets
        run: |
           echo "✅ No manual secrets required – DB password and SSH key are auto-generated by Terraform."

      ## ── IMPORTANT: ACM certificate must be created FIRST ──────────────────────
      ## This happens before imports because import commands trigger internal plans
      ## that would fail on the ACM for_each unknown values issue.
      - name: Two-phase apply for ACM certificate
        shell: bash -e -o pipefail {0}
        run: |
          set +e  # Disable exit-on-error, handle terraform codes manually
          
          echo "=== Phase 1: Create ACM certificate to get validation options ==="
          if ! terraform state show module.acm.aws_acm_certificate.this 2>/dev/null; then
            terraform apply -target=module.acm.aws_acm_certificate.this -auto-approve
            # Accept exit code 1 (warnings) or 0 (success), fail on others
            TF_EXIT=$?
            if [ $TF_EXIT -ne 0 ] && [ $TF_EXIT -ne 1 ]; then exit $TF_EXIT; fi
          else
            echo "Certificate already exists in state"
          fi
          
          echo "=== Phase 2: Create validation records now that cert exists ==="
          if terraform state show module.acm.aws_acm_certificate.this 2>/dev/null; then
            terraform apply -target=module.acm.aws_route53_record.validation -target=module.acm.aws_acm_certificate_validation.this -auto-approve
            TF_EXIT=$?
            if [ $TF_EXIT -ne 0 ] && [ $TF_EXIT -ne 1 ]; then exit $TF_EXIT; fi
          fi
          exit 0

      ## ── Now safe to run imports (certificate exists, plans won't fail) ────────
      - name: Import existing S3 bucket (if orphaned)
        run: |
           if aws s3api head-bucket --bucket broandbro-develop-ui 2>/dev/null; then
             echo "Bucket exists – checking state..."
             if ! terraform state show module.s3.aws_s3_bucket.this 2>/dev/null; then
               echo "Importing orphaned S3 bucket into state..."
               terraform import module.s3.aws_s3_bucket.this broandbro-develop-ui
             else
               echo "Bucket already in state – skipping."
             fi
           fi

      - name: Import existing EC2 Key Pair (if orphaned)
        run: |
           if aws ec2 describe-key-pairs --key-names broandbro-dev-key --region us-east-1 2>/dev/null; then
             echo "Key pair exists – checking state..."
             if ! terraform state show module.ec2.aws_key_pair.this 2>/dev/null; then
               echo "Importing orphaned key pair into state..."
               terraform import module.ec2.aws_key_pair.this broandbro-dev-key
             else
               echo "Key pair already in state – skipping."
             fi
           fi

      ## The shared media bucket may have been pre-created by bootstrap/bootstrap.tf
      ## or a previous apply. Import it so Terraform manages it without re-creating.
      ## If the state entry is tainted (left over from a failed apply), remove it
      ## and re-import so the taint is cleared and prevent_destroy does not block plan.
      - name: Import shared media bucket (if already exists)
        run: |
           BUCKET="${{ vars.MEDIA_BUCKET_NAME || 'broandbro-menu-images-shared' }}"
           if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
             echo "Media bucket $BUCKET exists – checking state..."
             STATE_OUTPUT=$(terraform state show aws_s3_bucket.media 2>/dev/null || true)
             if [ -z "$STATE_OUTPUT" ]; then
               echo "Not in state – importing..."
               terraform import aws_s3_bucket.media "$BUCKET"
             elif echo "$STATE_OUTPUT" | grep -q "(tainted)"; then
               echo "Bucket is tainted in state – removing taint and re-importing..."
               terraform state rm aws_s3_bucket.media
               terraform import aws_s3_bucket.media "$BUCKET"
             else
               echo "Bucket already in state and not tainted – skipping."
             fi
           else
             echo "Media bucket $BUCKET does not exist yet – will be created by apply."
           fi

      - name: Import existing CloudFront distribution (if orphaned)
        run: |
           # Find CloudFront distribution by CNAME alias
           # Use a more robust approach: list all distributions and filter with jq
           DISTRIBUTION_ID=$(aws cloudfront list-distributions --output json 2>/dev/null | jq -r '.DistributionList.Items[] | select(.Aliases.Items[]? == "dev.broandbro.in") | .Id' | head -1 || true)
           
           if [ -z "$DISTRIBUTION_ID" ]; then
             # Fallback: check if ANY CloudFront distribution exists for this environment
             # by looking at tags or listing all and checking aliases
             echo "Primary query found no distribution, trying alternative search..."
             DISTRIBUTION_ID=$(aws cloudfront list-distributions --output json 2>/dev/null | jq -r '.DistributionList.Items[] | select(.Comment == "broandbro-dev-frontend") | .Id' | head -1 || true)
           fi
           
           if [ -n "$DISTRIBUTION_ID" ]; then
             echo "CloudFront distribution $DISTRIBUTION_ID exists – checking state..."
             if ! terraform state show module.cloudfront.aws_cloudfront_distribution.this 2>/dev/null; then
               echo "Importing orphaned CloudFront distribution into state..."
               terraform import module.cloudfront.aws_cloudfront_distribution.this "$DISTRIBUTION_ID"
             else
               echo "CloudFront distribution already in state – skipping."
             fi
           else
             echo "CloudFront distribution not found – will be created by apply."
           fi

      - name: Import existing RDS instance (if orphaned)
        run: |
          if aws rds describe-db-instances --db-instance-identifier broandbro-dev --region us-east-1 2>/dev/null; then
            echo "RDS instance broandbro-dev exists – checking state..."
            if ! terraform state show module.rds.aws_db_instance.this 2>/dev/null; then
              echo "Importing orphaned RDS instance into state..."
              terraform import module.rds.aws_db_instance.this broandbro-dev
            else
              echo "RDS instance already in state – skipping."
            fi
          else
            echo "RDS instance not found – will be created by apply."
           fi


      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Check for CNAME conflicts before apply
        run: |
           # Double-check that no CNAME conflicts exist before trying to apply
           echo "Checking for existing CloudFront distributions with dev.broandbro.in CNAME..."
           CF_STATE=$(terraform state show module.cloudfront.aws_cloudfront_distribution.this 2>/dev/null || true)
           
           if [ -z "$CF_STATE" ]; then
             # CloudFront not in state, check AWS for any distribution with this CNAME
             # Use improved jq query to properly find distributions by CNAME alias
             CONFLICT_ID=$(aws cloudfront list-distributions --output json 2>/dev/null | jq -r '.DistributionList.Items[] | select((.Aliases.Items // []) | map(select(. == "dev.broandbro.in")) | length > 0) | .Id' | head -1)
             if [ -n "$CONFLICT_ID" ] && [ "$CONFLICT_ID" != "null" ]; then
               echo "⚠️  Found existing CloudFront distribution $CONFLICT_ID with dev.broandbro.in CNAME"
               echo "Importing distribution into Terraform state..."
               if terraform import module.cloudfront.aws_cloudfront_distribution.this "$CONFLICT_ID"; then
                 echo "✅ Successfully imported distribution into state"
                 echo "Re-running plan after state change..."
                 terraform plan -out=tfplan
               else
                 echo "❌ Import failed. The distribution may be managed outside Terraform."
                 echo "Please manually remove the conflicting distribution and retry."
                 exit 1
               fi
             else
               echo "No existing CloudFront distribution found with dev.broandbro.in CNAME"
             fi
           fi

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export outputs to GitHub summary
        run: |
          echo "## ✅ Dev Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL | https://dev.broandbro.in |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | https://dev-api.broandbro.in |" >> $GITHUB_STEP_SUMMARY
          CF_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "N/A")
          EC2_IP=$(terraform output -raw ec2_elastic_ip 2>/dev/null || echo "N/A")
          echo "| CloudFront ID | $CF_ID |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 IP | $EC2_IP |" >> $GITHUB_STEP_SUMMARY
