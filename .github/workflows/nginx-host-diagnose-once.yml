name: One-time Bro and Bro Nginx host routing diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/nginx-host-diagnose-once.yml]
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Inspect newly staged EC2 virtual hosts and HTTP responses
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 098859530205
          INSTANCE="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]]
          COMMAND='echo "NGINX VHOSTS"; nginx -T 2>&1 | grep -E "conflicting server name|server_name |listen 80|auth_basic|root /var/www" | tail -n 80; echo "STATIC INDEX"; ls -l /var/www/broandbro/index.html; echo "LOOPBACK HTTP"; for HOST in broandbro.in www.broandbro.in migrate-prod.broandbro.in api.broandbro.in; do echo "HOST: $HOST"; curl --noproxy "*" -sS -I --max-time 8 -H "Host: $HOST" http://127.0.0.1/ | head -n 12 || true; done; echo "GET MAIN + HEALTH"; for HOST in broandbro.in www.broandbro.in; do curl --noproxy "*" -sS --max-time 8 -o /dev/null -w "$HOST GET HTTP %{http_code}\\n" -H "Host: $HOST" http://127.0.0.1/ || true; done; for HOST in api.broandbro.in migrate-prod-api.broandbro.in; do curl --noproxy "*" -sS --max-time 8 -o /dev/null -w "$HOST HEALTH HTTP %{http_code}\\n" -H "Host: $HOST" http://127.0.0.1/actuator/health || true; done'
          python3 -c 'import json,sys;json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' "$COMMAND" "$RUNNER_TEMP/ssm.json"
          ID="$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/ssm.json" --query Command.CommandId --output text)"
          for i in $(seq 1 25); do
            STATUS="$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query '{Status:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                test "$STATUS" = Success
                exit
                ;;
            esac
            sleep 5
          done
          exit 1
