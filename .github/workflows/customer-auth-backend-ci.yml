name: Customer authentication backend validation
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/customer-auth-backend-ci.yml"
      - "scripts/deploy-backend-from-ssm.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile backend and run authentication tests
        run: gradle :backend:test --tests '*WhatsAppOtpServiceTest' --tests '*GoogleCustomerAuthServiceTest' :backend:bootJar --no-daemon
      - name: Validate deployment agent
        run: python3 -m py_compile scripts/deploy-backend-from-ssm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-auth-backend-test-results
          path: backend/build/test-results/test/
          if-no-files-found: warn
