name: One-time backend deploy for health probe fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/backend-health-deploy-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backend-deploy-prod.yml --repo "$GITHUB_REPOSITORY" --ref main
