name: Prepare Bro and Bro main hostnames on new EC2 (HTTP only)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: broandbro-prod-nginx-cutover-prep
  cancel-in-progress: false
jobs:
  stage-vhosts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Validate Nginx staging shell script syntax
        run: bash -n scripts/prepare-prod-nginx-cutover.sh
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Stage production hostnames on new EC2 without modifying DNS
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_NEW_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_ACCOUNT" = 098859530205
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
          INSTANCE="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=broandbro-prod-backend' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [[ "$INSTANCE" =~ ^i-[0-9a-f]+$ ]] || { echo "::error::Expected one running EC2 instance"; exit 1; }
          PAYLOAD="$(base64 -w0 scripts/prepare-prod-nginx-cutover.sh)"
          CMD="echo '$PAYLOAD' | base64 -d >/tmp/broandbro-main-cutover.sh && bash /tmp/broandbro-main-cutover.sh"
          python3 -c 'import json,sys;json.dump({"commands":[sys.argv[1]]},open(sys.argv[2],"w"))' \
            "$CMD" "$RUNNER_TEMP/params.json"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/params.json" \
            --timeout-seconds 180 \
            --comment "broandbro-main-cutover-vhosts-$GITHUB_RUN_ID" \
            --query 'Command.CommandId' --output text)"
          for ATTEMPT in $(seq 1 45); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Output:StandardOutputContent}' --output json
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
                  --query '{Status:StatusDetails,Error:StandardErrorContent,Output:StandardOutputContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Nginx staging timed out"; exit 1
