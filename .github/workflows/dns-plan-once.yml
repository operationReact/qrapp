name: One-time guarded read-only Terraform DNS plan
on:
  push:
    branches: [main]
    paths: [.github/workflows/dns-plan-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing read-only PROD plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run terraform-plan.yml --repo "$GITHUB_REPOSITORY" --ref main
