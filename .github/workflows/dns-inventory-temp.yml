name: Temporary public DNS record inventory
on:
  push:
    branches: [fix/route53-full-cutover-prep]
    paths: [.github/workflows/dns-inventory-temp.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory publicly discoverable DNS records only
        shell: bash
        run: |
          set -euo pipefail
          echo "AUTHORITATIVE_NS:"
          dig +short NS broandbro.in
          echo "PUBLIC_DNS_RECORDS:"
          for NAME in broandbro.in www.broandbro.in api.broandbro.in _dmarc.broandbro.in mail.broandbro.in autodiscover.broandbro.in autoconfig.broandbro.in smtp.broandbro.in imap.broandbro.in selector1._domainkey.broandbro.in selector2._domainkey.broandbro.in default._domainkey.broandbro.in hostinger._domainkey.broandbro.in; do
            for TYPE in MX TXT CAA CNAME A AAAA; do
              echo "BEGIN $NAME $TYPE"
              dig +time=2 +tries=1 +noall +answer "$NAME" "$TYPE" || true
              echo "END $NAME $TYPE"
            done
          done
