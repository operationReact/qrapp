name: One-time migration frontend lockfile repair (dev-only commit)

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/repair-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve package-lock using npm without running package scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install is now reproducible
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend against preview API
        working-directory: frontend
        env:
          VITE_API_URL: https://migrate-dev-api.broandbro.in
          VITE_ENV: dev
        run: npm run build
      - name: Commit corrected lockfile and retire one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/repair-lockfile.yml
          git commit -m "fix(frontend): synchronize npm lockfile for reproducible clean builds"
          git push origin HEAD:dev
