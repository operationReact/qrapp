name: Admin sidebar responsive validation
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/components/admin/AdminSidebar.jsx"
      - "frontend/src/components/ui/sidebar.jsx"
      - "frontend/src/styles/admin-sidebar-compact.css"
      - "scripts/admin-sidebar-check.mjs"
      - ".github/workflows/admin-sidebar-visual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser
        run: |
          mkdir -p "$RUNNER_TEMP/sidebar-browser"
          npm install --prefix "$RUNNER_TEMP/sidebar-browser" --no-audit --no-fund --save-exact playwright@1.56.1
          cp scripts/admin-sidebar-check.mjs "$RUNNER_TEMP/sidebar-browser/"
          "$RUNNER_TEMP/sidebar-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build and test candidate
        working-directory: frontend
        env:
          VITE_API_URL: https://api.broandbro.in
          VITE_ENV: prod
          NODE_ENV: production
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --include=dev
          npm run build
          npm run test:roles
          npm run test:all-locations
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/sidebar-preview.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/admin >/dev/null && break; sleep 1; done
          SCREENSHOT_DIR="$RUNNER_TEMP/sidebar-evidence/after" node "$RUNNER_TEMP/sidebar-browser/admin-sidebar-check.mjs"
      - name: Capture base screenshots
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VITE_API_URL: https://api.broandbro.in
          VITE_ENV: prod
          NODE_ENV: production
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sidebar-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/sidebar-base/frontend"
          npm ci --no-audit --no-fund --include=dev
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/sidebar-base.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/admin >/dev/null && break; sleep 1; done
          BASELINE=1 TEST_ORIGIN=http://127.0.0.1:4174 SCREENSHOT_DIR="$RUNNER_TEMP/sidebar-evidence/before" node "$RUNNER_TEMP/sidebar-browser/admin-sidebar-check.mjs"
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-sidebar-before-after
          path: ${{ runner.temp }}/sidebar-evidence/
          if-no-files-found: warn
          retention-days: 14
