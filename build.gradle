// Root build.gradle: common configuration for all subprojects
plugins {
    id 'io.spring.dependency-management' version '1.1.3'
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    apply plugin: 'java'

    group = 'com.broandbro'
    version = '0.0.1-SNAPSHOT'

    // Configure Java toolchain to set Java 21 for compilation in a Gradle-compatible way
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        // Use release flag to target Java 21 bytecode compatibility
        options.release = 21
    }

    dependencies {

        // Spring Boot test support
        testImplementation 'org.springframework.boot:spring-boot-starter-test'

        // Twilio WhatsApp SDK
        implementation 'com.twilio.sdk:twilio:10.1.2'

        // JSON support
        implementation 'org.json:json:20240303'
    }
}

// Note: The `backend` subproject contains its own Spring Boot plugin and
// is responsible for application packaging.