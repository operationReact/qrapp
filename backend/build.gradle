// Gradle build converted from existing pom.xml
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    // Removed the standalone io.spring.dependency-management plugin because
    // the Spring Boot Gradle plugin provides dependency management and the
    // older standalone plugin is incompatible with Gradle 9 (causes
    // NoSuchMethodError referencing LenientConfiguration.getArtifacts(Spec)).
    id 'maven-publish'
}

group = 'com.broandbro'
version = '0.0.1-SNAPSHOT'

// Use the Java toolchain to target Java 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    lombokVersion = '1.18.44'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Provide Spring Boot BOM as a platform so versions for Spring artifacts are available
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.4')

    // NOTE: The project previously used the Razorpay Java SDK (com.razorpay:razorpay-java:1.6.0)
    // resolved from Razorpay's repository. This codebase does not use the SDK classes (it
    // implements Razorpay HTTP calls directly), so the dependency has been omitted to avoid
    // build failures when the Razorpay repository is not accessible. If you need the SDK,
    // either place backend/lib/razorpay-java-1.6.0.jar and add it as a file dependency here,
    // or re-add the remote dependency and ensure network access to repo.razorpay.com.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Only PostgreSQL is required at runtime for this project
    runtimeOnly 'org.postgresql:postgresql'

    // JSON library used by Razorpay SDK wrapper
    implementation 'org.json:json:20240303'

    // Thumbnailator for image resizing and compression before storing in PostgreSQL BYTEA
    implementation 'net.coobird:thumbnailator:0.4.20'
    // ImageIO plugins for JPEGs with non-standard profiles (CMYK, progressive, etc.)
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'

    // Swagger / OpenAPI documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    // Bulk Upload: Excel (Apache POI) + CSV (OpenCSV)
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'com.opencsv:opencsv:5.9'

    // WebFlux (WebClient) for non-blocking HTTP calls to OpenAI
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // AWS SDK v2 for S3 image storage
    implementation platform('software.amazon.awssdk:bom:2.25.60')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sts'

    // Spring Retry for OpenAI resilience
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // AWS Parameter Store for centralized secret management
    implementation 'software.amazon.awssdk:ssm'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store:3.1.1'

    // Lombok: compileOnly + annotationProcessor to match original pom
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}

// Keep the jar produced by bootJar as the runnable artifact
bootJar {
    archiveBaseName.set('qrapp')
}


// Publishing helper: if a vendor JAR exists in backend/lib, allow publishing it to mavenLocal
def razorpayJar = file("${projectDir}/lib/razorpay-java-1.6.0.jar")
if (razorpayJar.exists()) {
    publishing {
        publications {
            razorpayVendor(MavenPublication) {
                groupId = 'com.razorpay'
                artifactId = 'razorpay-java'
                version = '1.6.0'
                artifact razorpayJar
            }
        }
        repositories {
            mavenLocal()
        }
    }

    tasks.register('publishRazorpayToMavenLocal') {
        group = 'publishing'
        description = 'Publish vendor razorpay JAR to the local Maven repository (mavenLocal)'
        dependsOn tasks.named('publishRazorpayVendorPublicationToMavenLocal')
    }
}
