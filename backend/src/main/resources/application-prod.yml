spring:
  config:
    import:
      - "optional:aws-parameterstore:/broandbro/backend/prod?prefix=app.parameter-store."
      - "optional:aws-parameterstore:/broandbro/backend/prod/whatsapp?prefix=app.parameter-store.whatsapp."
  cache:
    type: caffeine
    cache-names: walletBalance,menu,menuRecommended,otp
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${SPRING_DATASOURCE_HIKARI_POOL_NAME:QrAppHikariPool}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:540000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:30000}
      connection-init-sql: "SET statement_timeout = '8s'"

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:https://broandbro.in,https://www.broandbro.in}"

razorpay:
  key: ${RAZORPAY_KEY}
  secret: ${RAZORPAY_SECRET}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET}

twilio:
  accountSid: ${TWILIO_ACCOUNT_SID}
  authToken: ${TWILIO_AUTH_TOKEN}
  fromNumber: ${TWILIO_FROM_NUMBER}
  orderPlacedContentSid: ${TWILIO_ORDER_PLACED_CONTENT_SID}
  orderReadyContentSid: ${TWILIO_ORDER_READY_CONTENT_SID:}
  otpContentSid: ${TWILIO_OTP_CONTENT_SID}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:true}
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

openai:
  api-key: ${OPENAI_API_KEY}
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
  image-size: ${OPENAI_IMAGE_SIZE:1024x1024}

whatsapp:
  enabled: ${WHATSAPP_OTP_ENABLED:true}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:${app.parameter-store.whatsapp.phoneNumberId:}}
  access-token: ${WHATSAPP_ACCESS_TOKEN:${app.parameter-store.whatsapp.accessToken:}}
  verification-template-language: ${WHATSAPP_VERIFICATION_TEMPLATE_LANGUAGE:en}
  verification-template-name: ${WHATSAPP_VERIFICATION_TEMPLATE_NAME:bro_bro_verification_code}
  graph-api:
    version: ${META_GRAPH_API_VERSION:v23.0}
    base-url: ${META_GRAPH_API_BASE_URL:https://graph.facebook.com}
    timeout-seconds: ${WHATSAPP_API_TIMEOUT_SECONDS:10}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}
    reset-authorization-minutes: ${PASSWORD_RESET_AUTHORIZATION_MINUTES:10}
