# ── AWS S3 ────────────────────────────────────────────────────────────────────
# Enabled in production. All values MUST be supplied as environment variables.
# Required env vars on the EC2 / ECS instance:
#   AWS_S3_ENABLED=true
#   AWS_ACCESS_KEY_ID=<iam-access-key>
#   AWS_SECRET_ACCESS_KEY=<iam-secret-key>
#   AWS_S3_BUCKET_NAME=broandbro-menu-images          (or override)
#   AWS_S3_REGION=ap-east-1                      (or override)
aws:
  s3:
    enabled: ${AWS_S3_ENABLED:true}
    bucket-name: ${AWS_S3_BUCKET_NAME:broandbro-menu-images-prod}
    region: ${AWS_S3_REGION:ap-east-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

