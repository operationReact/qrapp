spring:
  cache:
    type: caffeine
    cache-names: walletBalance,menu,menuRecommended,otp
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats

  # ── AWS Configuration ─────────────────────────────────────────────────────
  # Provide default region so AWS SDK doesn't fail when initializing
  # On EC2: EC2 instance metadata service will override this
  # Locally: Uses this default
  cloud:
    aws:
      region:
        static: us-east-1

  # ── AWS Parameter Store Configuration ──────────────────────────────────────
  # Reads secrets from AWS Parameter Store (recommended for production)
  # Fallback: Uses environment variables if Parameter Store is not available
  config:
    import:
      - "optional:aws-parameterstore:/broandbro/backend/dev?prefix=app.parameter-store."
      - "optional:aws-parameterstore:/broandbro/backend/dev/whatsapp?prefix=app.parameter-store.whatsapp."

  datasource:
    # ONLY read from SSM Parameter Store (application-ssm-dev.yml)
    # NO environment variable fallbacks - ensures SSM values are always used
    url: ${app.parameter-store.database.url}
    username: ${app.parameter-store.database.username}
    password: ${app.parameter-store.database.password}

# ── AWS Parameter Store Configuration ────────────────────────────────────────
# SSM parameter values are defined in: application-ssm-dev.yml
# This file merges with application-ssm-dev.yml through Spring's profile mechanism

    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: QrAppHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 540000
      connection-timeout: 10000
      validation-timeout: 5000
      keepalive-time: 30000
      connection-init-sql: "SET statement_timeout = '8s'"
  flyway:
    enabled: true
    baseline-on-migrate: true
    #repair-on-migrate: true   # auto-repairs failed migration checksum on restart

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
   ## database-platform: org.hibernate.dialect.PostgreSQLDialect

  cors:
    allowed-origins: "${app.parameter-store.app.corsAllowedOrigins:https://develop.broandbro.in,http://localhost:5173}"
  bundle:
    discount-percent: 10       # 10 % of the recommended-items total
    max-discount-rupees: 50    # ₹50 absolute cap
    max-items: 3               # maximum items to include in one bundle
  meal:
    discount-percent: 10       # 10 % of the meal items total
    max-discount-rupees: 50    # ₹50 absolute cap

# WhatsApp OTP credentials are resolved from the dev SSM import when running
# the dev profile locally. Deployment environment variables take precedence.
whatsapp:
  enabled: ${WHATSAPP_OTP_ENABLED:true}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:${app.parameter-store.whatsapp.phoneNumberId:}}
  access-token: ${WHATSAPP_ACCESS_TOKEN:${app.parameter-store.whatsapp.accessToken:}}


# Default profile: require explicit Razorpay credentials from SSM Parameter Store
razorpay:
  key:           ${RAZORPAY_KEY:${app.parameter-store.razorpay.key:}}
  secret:        ${RAZORPAY_SECRET:${app.parameter-store.razorpay.secret:}}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:${app.parameter-store.razorpay.webhookSecret:}}

twilio:
  accountSid: ${app.parameter-store.twilio.accountSid:}
  authToken: ${app.parameter-store.twilio.authToken:}
  fromNumber: ${TWILIO_FROM_NUMBER:whatsapp:+14155238886}
  orderPlacedContentSid: ${TWILIO_ORDER_PLACED_CONTENT_SID:HX7926f06db10abf2c81bd27dc98c27423}
  orderReadyContentSid: ${TWILIO_ORDER_READY_CONTENT_SID:}
  otpContentSid: ${TWILIO_OTP_CONTENT_SID:HX229f5a04fd0510ce1b071852155d3e75}

# ── AWS S3 ────────────────────────────────────────────────────────────────────
# Disabled by default for local dev — no AWS credentials needed.
# To test real S3 uploads locally, export these env vars and restart:
#
#   export AWS_S3_ENABLED=true
#   export AWS_ACCESS_KEY_ID=your_key
#   export AWS_SECRET_ACCESS_KEY=your_secret
#   export AWS_S3_BUCKET_NAME=qrapp-menu-images   # optional, uses default
#   export AWS_S3_REGION=us-east-1               # optional, uses default
#
aws:
  s3:
    enabled: ${app.parameter-store.aws.s3.enabled:true}
    bucket-name: ${app.parameter-store.aws.s3.bucketName:broandbro-dev-root-bucket}
    region: ${app.parameter-store.aws.s3.region:us-east-1}
    access-key: ${app.parameter-store.aws.s3.accessKey:}
    secret-key: ${app.parameter-store.aws.s3.secretKey:}

# ── OpenAI Configuration ──────────────────────────────────────────────────
openai:
  api-key: ${app.parameter-store.openai.apiKey:}

# ── Allowed CORS Origins ────────────────────────────────────────────
# Comma-separated list of frontend domains that can access the API
# Override via environment variable: APP_CORS_ALLOWED_ORIGINS

# ── AWS Parameter Store Settings ────────────────────────────────────────────
# Enable auto-create only in dev environment
app:
  parameter-store:
    auto-create: true  # Enable auto-create in DEV environment
    environment: dev
