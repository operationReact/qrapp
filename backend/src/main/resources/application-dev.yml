spring:
  cache:
    type: caffeine
    cache-names: walletBalance,menu,menuRecommended,otp
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats

  # ── AWS Configuration ─────────────────────────────────────────────────────
  # Provide default region so AWS SDK doesn't fail when initializing
  # On EC2: EC2 instance metadata service will override this
  # Locally: Uses this default
  cloud:
    aws:
      region:
        static: us-east-1

  # ── AWS Parameter Store Configuration ──────────────────────────────────────
  # Reads secrets from AWS Parameter Store (recommended for production)
  # Fallback: Uses environment variables if Parameter Store is not available
  config:
    import: "optional:aws-parameterstore:"

  datasource:
    # Priority: Parameter Store → Environment Variables → Hardcoded defaults
    url: ${SPRING_DATASOURCE_URL:${app.parameter-store.database.url:jdbc:postgresql://broandbro-dev.chi2yu0m6hp0.us-east-1.rds.amazonaws.com:5432/broandbro_dev}}
    username: ${SPRING_DATASOURCE_USERNAME:${app.parameter-store.database.username:broandbro}}
    password: ${SPRING_DATASOURCE_PASSWORD:${app.parameter-store.database.password:BroApp#2025}}

# ── AWS Parameter Store Configuration ────────────────────────────────────────
# SSM parameter values are defined in: application-ssm-dev.yml
# This file merges with application-ssm-dev.yml through Spring's profile mechanism
# Do NOT add parameters here - they are imported from application-ssm-dev.yml
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${SPRING_DATASOURCE_HIKARI_POOL_NAME:QrAppHikariPool}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:540000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:30000}
      connection-init-sql: "SET statement_timeout = '8s'"
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    #repair-on-migrate: true   # auto-repairs failed migration checksum on restart

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
   ## database-platform: org.hibernate.dialect.PostgreSQLDialect
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:https://develop.broandbro.in,http://localhost:5173}"
  bundle:
    discount-percent: 10       # 10 % of the recommended-items total
    max-discount-rupees: 50    # ₹50 absolute cap
    max-items: 3               # maximum items to include in one bundle
  meal:
    discount-percent: 10       # 10 % of the meal items total
    max-discount-rupees: 50    # ₹50 absolute cap


