  secret:        ${RAZORPAY_SECRET:}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:}

twilio:
  accountSid: ${TWILIO_ACCOUNT_SID:ACc9ccb1101977a6bc3adc0806c56f026f}
  authToken: ${TWILIO_AUTH_TOKEN:8c98ee56d052a01711546c12441b230b}
  fromNumber: ${TWILIO_FROM_NUMBER:whatsapp:+14155238886}
  orderPlacedContentSid: ${TWILIO_ORDER_PLACED_CONTENT_SID:HX7926f06db10abf2c81bd27dc98c27423}
  orderReadyContentSid: ${TWILIO_ORDER_READY_CONTENT_SID:}
  otpContentSid: ${TWILIO_OTP_CONTENT_SID:HX229f5a04fd0510ce1b071852155d3e75}

# ── AWS S3 ────────────────────────────────────────────────────────────────────
# Disabled by default for local dev — no AWS credentials needed.
# To test real S3 uploads locally, export these env vars and restart:
#
#   export AWS_S3_ENABLED=true
#   export AWS_ACCESS_KEY_ID=your_key
#   export AWS_SECRET_ACCESS_KEY=your_secret
#   export AWS_S3_BUCKET_NAME=qrapp-menu-images   # optional, uses default
#   export AWS_S3_REGION=us-east-1               # optional, uses default
#
aws:
  s3:
    enabled: ${AWS_S3_ENABLED:true}
    bucket-name: ${AWS_S3_BUCKET_NAME:broandbro-menu-images-dev}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:AKIA34EPRSL6ICFWRYHI}
    secret-key: ${AWS_SECRET_ACCESS_KEY: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}

# ── Allowed CORS Origins ────────────────────────────────────────────
# Comma-separated list of frontend domains that can access the API
# Override via environment variable: APP_CORS_ALLOWED_ORIGINS

# ── AWS Parameter Store Settings ────────────────────────────────────────────
# Enable auto-create only in dev environment
app:
  parameter-store:
    auto-create: true  # Enable auto-create in DEV environment
    environment: dev
