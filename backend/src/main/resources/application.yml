server:
  port: 8080

# ──────────────────────────────────────────────────────────────────────────────
# AWS Parameter Store Configuration
# ──────────────────────────────────────────────────────────────────────────────
#
# AWS Parameter Store is the only SSM source.
# Parameters are managed manually in AWS and imported by the active profile.
# Environment variables provide explicit local/CI overrides.
#

# Default datasource: PostgreSQL. Use environment variables to override in CI or other environments.
spring:
  config:
    import: "optional:aws-parameterstore:"  # Optional - won't fail if AWS unavailable

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${SPRING_DATASOURCE_HIKARI_POOL_NAME:QrAppHikariPool}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:60000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:240000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:30000}
      connection-test-query: SELECT 1
      connection-init-sql: "SET statement_timeout = '8s'"
      # See application-dev.yml for rationale: keeps idle pooled connections
      # alive at the OS/socket level so they aren't silently dropped, which
      # otherwise stalls the next request for the full connection-timeout.
      data-source-properties:
        tcpKeepAlive: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    lock-retry-count: ${SPRING_FLYWAY_LOCK_RETRY_COUNT:180}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    ##database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          fetch_size: 50
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500

# Allowed CORS origins (comma-separated). Defaults to frontend dev server.
app:
  # ── AWS Parameter Store Configuration ────────────────────────────────────
  parameter-store:
    auto-create: false
    environment: default

  # ── CORS Configuration ─────────────────────────────────────────────────────
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}"

legal:
  terms-version: ${LEGAL_TERMS_VERSION:2026-09}
  privacy-policy-version: ${LEGAL_PRIVACY_POLICY_VERSION:2026-01}

# Analytics Engine configuration
analytics:
  cron:
    daily-sales:            "${ANALYTICS_CRON_DAILY_SALES:0 5 0 * * *}"
    daily-sales-intraday:   "${ANALYTICS_CRON_DAILY_SALES_INTRADAY:0 0 12 * * *}"
    hourly-orders:          "${ANALYTICS_CRON_HOURLY_ORDERS:0 2 * * * *}"
    menu-items:             "${ANALYTICS_CRON_MENU_ITEMS:0 10 0 * * *}"
    menu-items-intraday:    "${ANALYTICS_CRON_MENU_ITEMS_INTRADAY:0 30 12 * * *}"
    user-preferences:       "${ANALYTICS_CRON_USER_PREFERENCES:0 0 1 * * *}"
    coupon-analytics:       "${ANALYTICS_CRON_COUPON_ANALYTICS:0 15 0 * * *}"
    coupon-analytics-intraday: "${ANALYTICS_CRON_COUPON_ANALYTICS_INTRADAY:0 0 */6 * * *}"
  cache:
    dashboard-ttl-seconds:        ${ANALYTICS_CACHE_DASHBOARD_TTL:300}
    daily-sales-ttl-seconds:      ${ANALYTICS_CACHE_DAILY_SALES_TTL:900}
    hourly-orders-ttl-seconds:    ${ANALYTICS_CACHE_HOURLY_ORDERS_TTL:600}
    menu-items-ttl-seconds:       ${ANALYTICS_CACHE_MENU_ITEMS_TTL:900}
    coupon-analytics-ttl-seconds: ${ANALYTICS_CACHE_COUPON_ANALYTICS_TTL:900}
    recommendations-ttl-seconds:  ${ANALYTICS_CACHE_RECOMMENDATIONS_TTL:1800}
  limits:
    max-top-items:            ${ANALYTICS_LIMITS_MAX_TOP_ITEMS:50}
    max-date-range-days:      ${ANALYTICS_LIMITS_MAX_DATE_RANGE_DAYS:365}
    abuse-detection-threshold: ${ANALYTICS_LIMITS_ABUSE_THRESHOLD:1}
    churn-threshold-days:     ${ANALYTICS_LIMITS_CHURN_DAYS:30}
  order:
    # Location code used in human-readable order number generation
    # Format: LOCATIONCODE-YYYYMMDD-XXXX
    # Example: BB-20260515-0001
    location-code: "${APP_ORDER_LOCATION_CODE:${APP_ORDER_SHOP_CODE:BB}}"

# Recommendation Engine configuration
recommendation:
  cron:
    co-occurrence: "${RECOMMENDATION_CRON_CO_OCCURRENCE:0 30 1 * * *}"

# Razorpay settings are supplied by the active environment profile.
razorpay:
  key: ${RAZORPAY_KEY:}
  secret: ${RAZORPAY_SECRET:}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:}


openai:
  api-key: ${OPENAI_API_KEY:}
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
  image-quality: ${OPENAI_IMAGE_QUALITY:low}
  base-url: https://api.openai.com/v1
  image-size: ${OPENAI_IMAGE_SIZE:1024x1024}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:60}
  max-retries: ${OPENAI_MAX_RETRIES:3}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}
    location-bucket-name: ${AWS_S3_LOCATION_BUCKET_NAME:}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    enabled: ${AWS_S3_ENABLED:false}

whatsapp:
  # Enable OTP by default when the WhatsApp credentials are supplied through
  # Parameter Store. Set WHATSAPP_OTP_ENABLED=false to disable it explicitly.
  enabled: ${WHATSAPP_OTP_ENABLED:true}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:${app.parameter-store.whatsapp.phoneNumberId:}}
  access-token: ${WHATSAPP_ACCESS_TOKEN:${app.parameter-store.whatsapp.accessToken:}}
  verification-template-name: ${WHATSAPP_VERIFICATION_TEMPLATE_NAME:bro_bro_verification_code}
  verification-template-language: ${WHATSAPP_VERIFICATION_TEMPLATE_LANGUAGE:en}
  graph-api:
    version: ${META_GRAPH_API_VERSION:v23.0}
    base-url: ${META_GRAPH_API_BASE_URL:https://graph.facebook.com}
    timeout-seconds: ${WHATSAPP_API_TIMEOUT_SECONDS:10}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}
    reset-authorization-minutes: ${PASSWORD_RESET_AUTHORIZATION_MINUTES:10}
  webhook:
    verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}